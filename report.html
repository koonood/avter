   <div class="insight-grid">${insights.slice(0,12).map((x,i)=>`<article class="insight-card"><div class="ic-top"><span class="ic-cat">${esc(x.category||aiReportText('Insight'))}</span><span class="ic-num">${String(i+1).padStart(2,'0')}</span></div><h3>${esc(x.headline||aiReportText('Key finding'))}</h3><div class="finding">${escProse(x.finding||'')}</div><div class="why"><b>${esc(aiReportText('Why it matters:'))}</b> ${escProse(x.why_it_matters||'')} ${x.confidence?`<br><span style="color:var(--purple);font-weight:900">${esc(aiReportText('Confidence · '))}${esc(x.confidence)}</span>`:''}</div>${evidenceLink(x.evidence_ids)}</article>`).join('')||`<div class="muted">${esc(aiReportText('No executive insights returned.'))}</div>`}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">Diagnosis</div><h2>The relationship mechanism.</h2></div><p>Not “who is a bad person.” What observable sequence appears to have pushed the relationship from strain toward ending?</p></div>
  <div class="diagnosis-grid"><div class="diagnosis-main"><div class="eyebrow">Bottom line</div><p class="diagnosis-lead">${escProse(diagnosis.bottom_line||r.overall_story||aiReportText('No concise diagnosis returned.'))}</p><p><b>What changed first:</b> ${escProse(diagnosis.what_changed_first||'Not established.')}</p><p><b>Breakup mechanism:</b> ${escProse(diagnosis.breakup_mechanism||'Not established.')}</p><div class="micro" style="margin:12px 0 7px">Likely sequence</div><div class="chain">${(diagnosis.primary_drivers||[]).slice(0,6).map((x,i)=>`<span>${escProse(x)}</span>${i<(diagnosis.primary_drivers||[]).slice(0,6).length-1?'<i>→</i>':''}`).join('')||'<span>Insufficient evidence</span>'}</div></div>
   <div class="panel" style="padding:20px"><div class="eyebrow">Missed signals</div><h3>What should have been noticed earlier?</h3><div class="driver-list">${(diagnosis.missed_signals||[]).slice(0,7).map(x=>`<div class="driver"><b>Signal</b><p>${escProse(x)}</p></div>`).join('')||'<div class="driver"><p>No specific missed signals established.</p></div>'}</div></div></div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">Contribution analysis</div><h2>Who contributed to the deterioration?</h2></div><p>Specific observed behaviors, not moral blame. If the archive supports asymmetry, the report should say so instead of hiding behind “both sides.”</p></div>
  <div class="contrib-grid">${(diagnosis.contribution_analysis||[]).map(c=>`<article class="contrib"><div class="who">${esc(c.participant||'Participant')}</div><div class="impact"><b>Observed contribution:</b> ${escProse(c.observed_contribution||'')}<br><br><b>Impact:</b> ${escProse(c.impact_on_relationship||'')}</div><div class="confidence-line">${esc(c.confidence||'Confidence not stated')}</div></article>`).join('')||'<div class="contrib"><div class="who">No participant-level conclusion</div><div class="impact">The archive does not support a specific asymmetry strongly enough.</div></div>'}</div>
 </section>

 <section class="kpis"><div class="kpi"><strong>${esc(datePretty(s.start_date))}</strong><span>archive starts</span></div><div class="kpi"><strong>${compact(s.total_messages||payload.total_messages)}</strong><span>messages</span></div><div class="kpi"><strong>${phases.length}</strong><span>relationship phases</span></div><div class="kpi"><strong>${turns.length}</strong><span>turning points</span></div><div class="kpi"><strong>${esc(datePretty(shift.date))}</strong><span>largest shift</span></div></section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">01 · ${esc(aiReportText('AI section: Communication'))}</div><h2>What changed over time?</h2></div><p>One visual story first. The numbers describe observable communication patterns — not love.</p></div>
  <div class="grid-main"><div class="panel"><div class="eyebrow">${esc(aiReportText('Relationship signal over time'))}</div><h3>${esc(aiReportText('Open → connected → structural shift'))}</h3><p class="panel-sub">${esc(aiReportText('A 0–100 observable communication index built from reciprocity, repair, future-oriented language and affection markers.'))}</p><div class="signal-wrap">${signalChart(timeline,shiftIndex)}</div><div class="warmth-panel"><div class="warmth-head"><div><div class="eyebrow">${esc(aiReportText('Warmth in the words'))}</div><h4>${esc(aiReportText('Affectionate-language messages'))}</h4></div></div><p class="warmth-note">${esc(aiReportText('Share of messages with affectionate language patterns; this is not an emotion score. Months with fewer than 30 messages are left unscored.'))}</p>${warmthChart(timeline)}</div><div class="signal-cards">${sigCards}</div>${chartHelp('signal')}</div>
  <div class="panel participation"><div><div class="eyebrow">Participation</div><h3>Who carried the volume?</h3><p class="panel-sub">Share of all parsed messages.</p></div><div class="donut" style="background:conic-gradient(var(--purple) 0 ${p0Share*3.6}deg,#ddd8e6 ${p0Share*3.6}deg 360deg)"><div class="donut-center"><div><strong>${p0Share}%</strong><span>${esc(p0)}</span></div></div></div><div><div class="person-row"><span class="person-name"><i class="sw"></i>${esc(p0)}</span><b>${p0Share}%</b></div><div class="person-row"><span class="person-name"><i class="sw alt"></i>${esc(p1)}</span><b>${p1Share}%</b></div></div></div></div>
  <div class="panel volume"><div class="eyebrow">Message volume</div><h3>Communication intensity by month</h3><p class="panel-sub">Months are distributed evenly so the timeline remains readable.</p><div class="volume-chart">${monthly.slice(-12).map(x=>`<div class="vwrap"><div class="vbar chart-target" data-chart-tip="<b>${esc(chartDateLabel(x.month))}</b><div>Messages: <strong>${esc(x.messages)}</strong></div>" style="height:${Math.max(2,Number(x.messages||0)/volMax*100)}%"><span class="vvalue">${compact(x.messages)}</span></div><span class="vmonth">${esc(monthShort(x.month))}</span></div>`).join('')}</div>${chartHelp('messageVolume')}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">02 · ${esc(aiReportText('AI section: Recurring contact'))}</div><h2>The routines that repeated.</h2></div><p>These are counted from the full archive. A repeated ritual is observable; its emotional meaning is interpreted separately.</p></div><div class="ritual-grid">${ritualCards||'<div class="muted">No recurring contact rituals were detected strongly enough to display.</div>'}</div></section>
 <section class="section"><div class="section-head"><div><div class="eyebrow">03 · ${esc(aiReportText('AI section: Change'))}</div><h2>What actually changed?</h2></div><p>Instead of four confusing lines, compare the communication markers directly.</p></div>
  <div class="panel"><div class="ba-grid">${metrics.map(m=>`<div class="ba-row"><div class="ba-name">${esc(aiReportText(m.metric||''))}</div><div class="ba-track"><i class="ba-before" style="width:${Math.max(0,Math.min(100,Number(m.before_value||0)))}%"></i><i class="ba-after" style="width:${Math.max(0,Math.min(100,Number(m.after_value||0)))}%"></i></div><div class="ba-values"><span>${esc(m.before_value)}</span> <span class="ba-key">→ ${esc(m.after_value)}</span></div></div>`).join('')||'<div class="muted">No before/after metrics returned.</div>'}</div><div class="ba-note"><b>${esc(aiReportText('Gray = before'))}</b> · <span style="color:var(--purple);font-weight:900">${esc(aiReportText('purple = after'))}</span> · ${esc(aiReportText('Each measure describes observable communication markers, not feelings.'))}</div></div>
 </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">04 · ${esc(aiReportText('AI section: Relationship arc'))}</div><h2>How the relationship evolved.</h2></div><p>A compressed timeline keeps the story readable while preserving the original AI summaries.</p></div>
  <div class="story-timeline">${phaseCards||'<div class="muted">No relationship phases returned.</div>'}</div>
 </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">05 · ${esc(aiReportText('AI section: Turning points'))}</div><h2>Where the story changed.</h2></div><p>Short cards. Date first. Change second. Meaning last.</p></div>
  <div class="turn-grid">${turns.slice(0,8).map((t,i)=>`<article class="turn-card"><div class="date">${esc(t.date||'Turning point '+(i+1))}</div><h3>${esc(t.title||aiReportText('Turning point'))}</h3><p>${escProse(t.what_changed||t.why_it_matters||'')}</p><span class="badge">${esc(aiReportText('Turning point'))}</span>${evidenceLink(t.evidence_ids)}</article>`).join('')||`<div class="muted">${esc(aiReportText('No sufficiently supported turning points returned.'))}</div>`}</div>
 </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">06 · ${esc(aiReportText('AI section: Patterns'))}</div><h2>The loops underneath the story.</h2></div></div>
  <div class="grid-main"><div class="panel"><div class="eyebrow">Recurring patterns</div><h3>What repeated?</h3><div class="pattern-grid">${(r.recurring_loops||[]).slice(0,6).map((x,i)=>`<div class="mini-card"><div class="n">0${i+1}</div><p>${escProse(x)}</p></div>`).join('')||'<div class="mini-card"><p>No sufficiently supported recurring loops returned.</p></div>'}</div></div><div class="panel"><div class="eyebrow">Repair attempts</div><h3>What happened after conflict?</h3><div class="repair-grid">${(r.repair_attempts||[]).slice(0,6).map((x,i)=>`<div class="repair-row"><b>${i+1}</b><span>${escProse(x)}</span></div>`).join('')||'<div class="repair-row"><span>No sufficiently supported repair observations returned.</span></div>'}</div></div></div>
 </section>

  <section class="section" id="aiEvidence"><div class="section-head"><div><div class="eyebrow">07 · ${esc(aiReportText('AI section: Evidence'))}</div><h2>The exact messages behind the conclusion.</h2></div><p>Speaker, date, message, then the explanation. Nothing is hidden inside a wall of text.</p></div>
  <div class="evidence-grid">${evidence.slice(0,8).map(e=>`<article class="evidence-card" data-ai-evidence-id="${esc(e.message_id||'')}"><div class="evidence-head"><span class="speaker">${esc(e.speaker||'Unknown')}</span><span class="evidence-date">${esc(datePretty(e.date||''))}</span></div><div class="quote">${esc(e.quote||'')}</div><div class="meaning"><div class="meaning-label">${esc(aiReportText('What this shows'))}</div><p>${escProse(e.context||e.interpretation||'')}</p></div><div class="more-meaning meaning"><div class="meaning-label">${esc(aiReportText('Why it matters'))}</div><p>${escProse(e.interpretation||'')}</p></div><button class="evidence-toggle" type="button" aria-expanded="false">${esc(aiReportText('Show interpretation +'))}</button></article>`).join('')||`<div class="muted">${esc(aiReportText('No evidence items returned.'))}</div>`}</div>
 </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">08 · ${esc(aiReportText('AI section: Intervention'))}</div><h2>When could something realistically have been done?</h2></div><p>Green = stronger opportunity. Amber = uncertain. Red = likely too late.</p></div>
  <div class="intervention">${windows.slice(0,6).map((w,i)=>`<article class="window-card ${windowClass(w,i)}"><div class="window-date">${esc(w.period||'Period')}</div><span class="status">${esc(w.type||w.assessment||'window')}</span><h3>${esc(w.assessment||w.type||'Intervention window')}</h3><p>${escProse(w.reason||'')}</p><div class="why">${escProse(w.what_could_have_helped||'')}</div></article>`).join('')||'<div class="muted">No intervention windows returned.</div>'}</div>
 </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">09 · ${esc(aiReportText('AI section: Questions'))}</div><h2>So… why did it end?</h2></div><p>Direct answers with calibrated confidence. No invented certainty.</p></div>
   <div class="answers">${answers.map((x,i)=>`<article class="answer-card ${i===0?'open':''}"><button class="answer-btn" type="button" aria-expanded="${i===0?'true':'false'}"><strong>${esc(x.question||aiReportText('Question'))}</strong><span class="answer-plus">${i===0?'−':'+'}</span></button><div class="answer-body"><div class="answer-lead">${escProse(x.answer||'')} ${x.confidence?`<br><span class="micro">${esc(aiReportText('Confidence · '))}${esc(x.confidence)}</span>`:''}${evidenceLink(x.evidence_ids)}</div></div></article>`).join('')||`<div class="muted">${esc(aiReportText('No breakup questions returned.'))}</div>`}</div>
 </section>

  <section class="section" id="aiNextSteps"><div class="section-head"><div><div class="eyebrow">10 · ${esc(aiReportText('Next steps'))}</div><h2>${esc(aiReportText('Practical recommendations'))}</h2></div><p>${esc(aiReportText('Evidence-based suggestions, not a verdict about either person.'))}</p></div>
    <div class="ai-recommendation-lead"><div class="eyebrow">${esc(aiReportText('Personalized bottom line'))}</div><p>${escProse(recLead)}</p>${evidenceLink(recommendations.evidence_ids)||`<button type="button" class="ai-evidence-link" data-ai-evidence-target="aiEvidence">${esc(aiReportText('AI extra: Review evidence'))}</button>`}</div>
   <div class="ai-recommendation-grid">
    <article class="ai-recommendation-card"><div class="eyebrow">01 · ${esc(aiReportText('Core lessons'))}</div><h3>${esc(aiReportText('What to look for next time'))}</h3>${bulletList(listOf(recommendations.core_lessons).length?recommendations.core_lessons:recommendations.what_to_look_for,aiReportText('No specific recommendation could be grounded in this archive.'))}</article>
    <article class="ai-recommendation-card"><div class="eyebrow">02 · ${esc(aiReportText('Green flags'))}</div><h3>${esc(aiReportText('What to look for'))}</h3>${bulletList(recommendations.green_flags,aiReportText('No specific recommendation could be grounded in this archive.'))}<h3>${esc(aiReportText('Early warning signs'))}</h3>${bulletList(recommendations.early_red_flags,aiReportText('No specific recommendation could be grounded in this archive.'))}</article>
     <article class="ai-recommendation-card"><div class="eyebrow">03 · ${esc(aiReportText('Your own growth'))}</div><h3>${esc(aiReportText('Your own growth'))}</h3>${bulletList(recommendations.own_growth_edges,aiReportText('No specific recommendation could be grounded in this archive.'))}<h3>${esc(aiReportText('What to discuss early'))}</h3>${bulletList(recommendations.what_to_communicate_early,aiReportText('No specific recommendation could be grounded in this archive.'))}<h3>${esc(aiReportText('First month questions'))}</h3>${bulletList(firstMonth,aiReportText('No specific recommendation could be grounded in this archive.'))}</article>
   </div>
   <div class="ai-branch-grid">
    <article class="ai-branch-card"><div class="eyebrow">${esc(aiReportText('If considering repair'))}</div><h3>${esc(aiReportText('If considering repair'))}</h3>${bulletList(actionPlan.if_considering_repair,aiReportText('No specific recommendation could be grounded in this archive.'))}</article>
    <article class="ai-branch-card"><div class="eyebrow">${esc(aiReportText('If moving forward'))}</div><h3>${esc(aiReportText('If moving forward'))}</h3>${bulletList(actionPlan.if_moving_forward,aiReportText('No specific recommendation could be grounded in this archive.'))}</article>
   </div>
   ${dayPlan?detailBlock(aiReportText('First 30 days'),`<p>${esc(aiReportText('The 30-day plan is a guide for reflection, not a test to apply to a new partner.'))}</p><div class="ai-detail-grid">${dayPlan}</div>`):''}
    ${listOf(actionPlan.personal_habits_to_practice).length?detailBlock(aiReportText('AI extra: Habits to practice'),bulletList(actionPlan.personal_habits_to_practice)):''}
    ${actionPlan.closing_principle?`<div class="ai-recommendation-lead"><div class="eyebrow">${esc(aiReportText('AI extra: Closing principle'))}</div><p>${escProse(actionPlan.closing_principle)}</p></div>`:''}
   ${needCards||listOf(needsAnalysis.friction_points).length||listOf(needsAnalysis.clarifying_conversations).length?detailBlock(aiReportText('Emotional needs and friction points'),`${needsAnalysis.framework_note?`<p>${escProse(needsAnalysis.framework_note)}</p>`:''}<div class="ai-detail-grid">${needCards}</div>${listOf(needsAnalysis.friction_points).length?`<h3>${esc(aiReportText('Possible friction points'))}</h3>${bulletList(needsAnalysis.friction_points)}`:''}${listOf(needsAnalysis.clarifying_conversations).length?`<h3>${esc(aiReportText('Clarifying conversations'))}</h3>${bulletList(needsAnalysis.clarifying_conversations)}`:''}`):''}
   ${loveCards||listOf(loveLanguages.compatibility_and_mismatch).length||listOf(loveLanguages.practical_translation).length?detailBlock(aiReportText('Affection patterns'),`${loveLanguages.framework_note?`<p>${escProse(loveLanguages.framework_note)}</p>`:''}<div class="ai-detail-grid">${loveCards}</div>${bulletList(loveLanguages.compatibility_and_mismatch)}${bulletList(loveLanguages.practical_translation)}`):''}
   ${compatibilityRows?detailBlock(aiReportText('Compatibility by area'),`${compatibility.framework_note?`<p>${escProse(compatibility.framework_note)}</p>`:''}<p>${escProse(compatibility.overall_read||'')}${compatibility.do_not_reduce_to_score?` ${escProse(compatibility.do_not_reduce_to_score)}`:''}</p><div class="ai-detail-grid">${compatibilityRows}</div>`):''}
   ${loopDetails?detailBlock(aiReportText('Recurring conflict patterns'),`<div class="ai-detail-grid">${loopDetails}</div>`):''}
   ${conflictCards?detailBlock(aiReportText('Clearer ways to say it'),conflictCards):''}
   ${scenarioCards?detailBlock(aiReportText('Possible alternative scenarios'),`<div class="ai-detail-grid">${scenarioCards}</div>`):''}
  </section>

  <section class="section"><div class="section-head"><div><div class="eyebrow">11 · ${esc(aiReportText('AI section: Final read'))}</div><h2>What the archive actually supports.</h2></div></div>
  <div class="panel final"><div class="final-main"><div class="eyebrow">The short version</div><h2>${esc(shift.title||'A relationship changed before it ended.')}</h2><p>${escProse(first)}</p></div><div class="support-list"><div class="support"><b>Observable</b><span><strong>${esc(datePretty(shift.date))}</strong> is the strongest structural shift supported by the archive.</span></div><div class="support"><b>Not established</b><span>The archive does not prove another person's private reasoning or an affair without direct evidence.</span></div><div class="support"><b>How to read this</b><span>Repeated patterns across dates matter more than one dramatic message.</span></div><div class="support"><b>Not supported</b><span>${escProse((diagnosis.not_supported||[]).slice(0,2).join(" "))}</span></div></div></div>
 </section>
 <div class="footer">after separates measured communication behavior from interpretation. The report does not claim to know when someone stopped loving another person; it identifies when observable patterns changed and shows the evidence behind those conclusions.</div>`;

 document.querySelectorAll('.evidence-toggle').forEach(b=>b.onclick=()=>{const c=b.closest('.evidence-card');if(!c)return;const open=c.classList.toggle('open');b.setAttribute('aria-expanded',open?'true':'false');b.textContent=aiReportText(open?'Hide interpretation −':'Show interpretation +')});
  document.querySelectorAll('.answer-btn').forEach(b=>b.onclick=()=>{const c=b.closest('.answer-card');if(!c)return;const open=c.classList.toggle('open');b.setAttribute('aria-expanded',open?'true':'false');const icon=b.querySelector('.answer-plus');if(icon)icon.textContent=open?'−':'+'});
  document.querySelectorAll('[data-ai-evidence-target]').forEach(b=>b.onclick=()=>{const id=b.getAttribute('data-ai-evidence-target'),card=[...document.querySelectorAll('.evidence-card[data-ai-evidence-id]')].find(item=>item.dataset.aiEvidenceId===id),target=card||document.getElementById(id);if(!target)return;if(card){card.classList.add('open','ai-evidence-focus');const toggle=card.querySelector('.evidence-toggle');if(toggle){toggle.setAttribute('aria-expanded','true');toggle.textContent=aiReportText('Hide interpretation −')}}target.scrollIntoView({behavior:'smooth',block:'center'});if(card)setTimeout(()=>card.classList.remove('ai-evidence-focus'),2200)});
 document.getElementById('pdfBtn').onclick=async()=>{const b=document.getElementById('pdfBtn');b.disabled=true;b.textContent=aiReportText('Preparing PDF…');try{const resp=await fetch('/report/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!resp.ok){let e='PDF generation failed';try{const j=await resp.json();e=j.detail||e}catch(_){ }throw new Error(e)}const blob=await resp.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='after_relationship_report.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);b.textContent=aiReportText('PDF downloaded');setTimeout(()=>{b.textContent=RT('pdf');b.disabled=false},1200)}catch(e){if(String(e.message||'').toLowerCase().includes('reportlab')||String(e.message||'').toLowerCase().includes('pdf support')){b.disabled=false;b.textContent=aiReportText('Print / Save as PDF');window.print();setTimeout(()=>{b.textContent=RT('pdf')},1500)}else{alert(e.message);b.textContent=RT('pdf');b.disabled=false}}};
}
loadReportPayload().then(ok=>{
  const lang=reportLang();
  document.documentElement.lang=lang;
  installLanguageObserver();
  render();
  installReportLanguage();
  translateReportText();
  translateFreeReportStatic();
  requestAnimationFrame(()=>{translateReportText();translateFreeReportStatic();installReportLanguage()});
  if(!payload?.ai_report)resumeAiRunIfNeeded();
});
</script>
