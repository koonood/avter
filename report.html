<title>After — Relationship Report</title>
<style>
:root{
 --bg:#f7f6f3;--surface:#fff;--ink:#17151b;--muted:#77727d;--line:#e5e1e8;
 --purple:#6d4df6;--purple2:#eee9ff;--purple3:#cfc2ff;--green:#20815e;--green2:#e7f5ee;
 --amber:#b27a14;--amber2:#fff3d8;--red:#b64d5b;--red2:#fdebed;
 --shadow:0 16px 50px rgba(35,27,55,.07);--r:24px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}main{max-width:1240px;margin:auto;padding:26px 4.5vw 90px}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 4.5vw;background:rgba(247,246,243,.9);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{font-size:23px;font-weight:900;letter-spacing:-.06em}.brand i{color:var(--purple);font-style:normal}.top-actions{display:flex;gap:8px}.top-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:850;cursor:pointer}.top-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.report-lang{display:flex;gap:3px;padding:3px;border:1px solid var(--line);background:#fff;border-radius:12px}.report-lang button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 7px;font-size:9px;font-weight:900;cursor:pointer}.report-lang button.active{background:var(--ink);color:#fff}.report-lang button:hover{color:var(--ink)}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--purple)}.muted{color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.75fr);gap:14px;margin-top:28px}.hero-main,.hero-side,.panel,.kpi,.story-card,.evidence-card,.answer-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}.hero-main{padding:36px 38px;background:radial-gradient(circle at 92% 12%,#eee9ff 0,rgba(238,233,255,0) 36%),#fff;min-height:292px}.hero-main h1{font-size:clamp(46px,7vw,82px);line-height:.88;letter-spacing:-.075em;margin:11px 0 17px;max-width:850px}.hero-main p{max-width:760px;color:var(--muted);font-size:15px;line-height:1.6;margin:0}.hero-side{display:grid;grid-template-rows:1fr auto;overflow:hidden}.shift{padding:28px}.shift-date{font-size:45px;font-weight:950;letter-spacing:-.07em;margin:9px 0 14px;color:var(--purple)}.shift-title{font-size:19px;font-weight:900;line-height:1.05;letter-spacing:-.035em}.shift-copy{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}.confidence{border-top:1px solid var(--line);padding:16px 20px;background:#fbfafc;font-size:10px;color:var(--muted);line-height:1.5}.confidence b{color:var(--ink)}
.hero-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.tag{font-size:10px;font-weight:850;padding:8px 10px;border-radius:999px;background:var(--purple2);color:var(--purple);border:1px solid #ddd5ff}.tag.neutral{background:#f5f3f0;color:#5e5962;border-color:#e7e2db}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.kpi{padding:17px 15px;box-shadow:none}.kpi strong{display:block;font-size:21px;letter-spacing:-.05em}.kpi span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-top:5px;font-weight:800}
.section{margin-top:52px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.section-head h2{font-size:31px;line-height:1;letter-spacing:-.06em;margin:6px 0 0}.section-head p{max-width:460px;color:var(--muted);font-size:11px;line-height:1.45;margin:0}.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.65fr);gap:12px}.panel{padding:25px;box-shadow:none}.panel h3{font-size:18px;letter-spacing:-.04em;margin:6px 0 5px}.panel-sub{font-size:10px;line-height:1.45;color:var(--muted);margin:0}
/* highlight language */
.prose{font-size:14px;line-height:1.7;color:#514c55}.prose strong,.highlight{font-weight:900;color:var(--ink)}.accent{color:var(--purple);font-weight:900;background:linear-gradient(transparent 62%,#e7e0ff 62%);padding:0 2px}.date-accent{color:var(--purple);font-weight:900}.micro{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}
/* signal chart */
.signal-wrap{margin-top:22px}.signal-svg{width:100%;height:auto;display:block}.gridline{stroke:#ebe7ee;stroke-width:1}.axis-label{font-size:9px;fill:#938d98}.signal-path{fill:none;stroke:var(--purple);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.signal-point{fill:#fff;stroke:var(--purple);stroke-width:3}.signal-value{font-size:11px;fill:var(--purple);font-weight:950}.shift-marker{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 5}.shift-marker-label{font-size:9px;fill:var(--red);font-weight:900}.month-label{font-size:10px;fill:#625d67;font-weight:850}.signal-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:13px}.signal-card{min-width:0;padding:10px 9px;border:1px solid var(--line);border-radius:13px;background:#fcfbfd}.signal-card .month{font-size:9px;font-weight:900;color:var(--purple);text-transform:uppercase}.signal-card .sig{font-size:20px;font-weight:950;letter-spacing:-.05em;margin-top:4px}.signal-card .desc{font-size:9px;line-height:1.35;color:var(--muted);margin-top:4px;min-height:25px}
/* participation */
.participation{display:flex;flex-direction:column;justify-content:space-between;height:100%}.donut{width:160px;height:160px;border-radius:50%;margin:14px auto 12px;position:relative;background:conic-gradient(var(--purple) 0 50%,#ddd8e6 50% 100%)}.donut:after{content:"";position:absolute;inset:31px;background:#fff;border-radius:50%}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}.donut-center strong{font-size:24px;letter-spacing:-.05em}.donut-center span{font-size:9px;color:var(--muted);display:block;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:11px}.person-row b{font-size:13px}.person-name{display:flex;align-items:center;gap:7px}.sw{width:8px;height:8px;border-radius:50%;background:var(--purple)}.sw.alt{background:#d9d3e0}
/* volume */
.volume{margin-top:12px}.volume-chart{height:250px;display:flex;align-items:flex-end;gap:8px;padding:0 2px 28px;border-bottom:1px solid var(--line)}.vwrap{height:100%;flex:1;min-width:35px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.vbar{width:min(40px,72%);background:linear-gradient(180deg,#7558fa,#a090ff);border-radius:9px 9px 3px 3px;position:relative;min-height:3px}.vbar:hover{filter:brightness(.95)}.vvalue{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:var(--purple)}.vmonth{margin-top:8px;font-size:9px;font-weight:850;color:#625d67;white-space:nowrap}
/* before after */
.ba-grid{display:grid;gap:14px}.ba-row{display:grid;grid-template-columns:160px minmax(0,1fr) 105px;align-items:center;gap:14px}.ba-name{font-size:11px;font-weight:900}.ba-track{height:25px;background:#f1eef3;border-radius:8px;position:relative;overflow:hidden}.ba-before{position:absolute;left:0;top:0;height:100%;background:#bcb5c4;border-radius:8px}.ba-after{position:absolute;left:0;bottom:0;height:100%;background:var(--purple);border-radius:8px;mix-blend-mode:multiply;opacity:.88}.ba-values{text-align:right;font-size:10px;font-weight:900}.ba-key{color:var(--purple)}.ba-note{font-size:9px;color:var(--muted);margin-top:15px}
/* story timeline */
.story-timeline{position:relative;padding:8px 0 0}.story-timeline:before{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:2px;background:#e4dff0}.story-card{position:relative;margin:0 0 10px 30px;padding:17px 18px;box-shadow:none}.story-card:before{content:"";position:absolute;left:-28px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 4px var(--purple2)}.story-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.story-date{font-size:9px;color:var(--purple);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.story-card h3{font-size:16px;margin:5px 0 7px;letter-spacing:-.035em}.story-card p{font-size:10px;line-height:1.5;color:var(--muted);margin:0;max-width:850px}.story-metric{font-size:10px;font-weight:900;background:var(--purple2);color:var(--purple);border-radius:999px;padding:6px 8px;white-space:nowrap}

.turn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.turn-card{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}.turn-card .date{font-size:9px;font-weight:900;color:var(--purple);text-transform:uppercase}.turn-card h3{font-size:15px;margin:7px 0 5px;letter-spacing:-.03em}.turn-card p{font-size:10px;line-height:1.45;color:var(--muted);margin:0}.turn-card .badge{display:inline-block;margin-top:10px;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);background:var(--purple2);padding:5px 7px;border-radius:999px}
/* recurring rituals */
.ritual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ritual-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.ritual-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.ritual-name{font-size:13px;font-weight:950;letter-spacing:-.025em}.ritual-count{font-size:22px;font-weight:950;color:var(--purple);letter-spacing:-.05em;white-space:nowrap}.ritual-meta{font-size:9px;color:var(--muted);margin-top:4px}.ritual-track{height:7px;background:#eeeaf3;border-radius:99px;margin:13px 0 8px;overflow:hidden}.ritual-bar{height:100%;background:var(--purple);border-radius:99px}.ritual-change{font-size:10px;line-height:1.45;color:var(--muted)}.ritual-change b{color:var(--ink)}.ritual-ai{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;line-height:1.45}.ritual-ai strong{color:var(--purple)}

.pattern-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fcfbfd}.mini-card .n{font-size:9px;color:var(--purple);font-weight:950}.mini-card p{font-size:10px;line-height:1.45;margin:6px 0 0}.repair-grid{display:grid;gap:8px}.repair-row{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;padding:11px 12px;background:#f8f6fb;border-radius:12px}.repair-row b{width:22px;height:22px;border-radius:7px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:9px}.repair-row span{font-size:10px;line-height:1.45}

.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.evidence-card{padding:17px;box-shadow:none}.evidence-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.speaker{font-size:9px;font-weight:950;text-transform:uppercase;color:var(--purple);letter-spacing:.08em}.evidence-date{font-size:9px;color:var(--muted);font-weight:800}.quote{font-size:17px;line-height:1.4;letter-spacing:-.025em;font-weight:850;margin:15px 0 12px}.quote::before{content:'“';color:var(--purple);font-size:30px;vertical-align:-7px;margin-right:2px}.meaning{border-top:1px solid var(--line);padding-top:11px}.meaning-label{font-size:8px;color:var(--purple);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.meaning p{font-size:10px;color:var(--muted);line-height:1.45;margin:4px 0 0}.evidence-toggle{margin-top:10px;border:0;background:var(--purple2);color:var(--purple);font-size:9px;font-weight:900;padding:7px 9px;border-radius:8px;cursor:pointer}.more-meaning{display:none}.evidence-card.open .more-meaning{display:block}
/* intervention */
.intervention{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.window-card{border-radius:17px;padding:18px;border:1px solid var(--line);background:#fff}.window-card.green{background:var(--green2);border-color:#cfeade}.window-card.amber{background:var(--amber2);border-color:#f2dfb4}.window-card.red{background:var(--red2);border-color:#f2ccd1}.window-card .window-date{font-size:10px;font-weight:950}.window-card .status{display:inline-block;margin-top:7px;font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;padding:5px 7px;border-radius:999px;background:#fff}.window-card h3{font-size:16px;margin:11px 0 5px;letter-spacing:-.035em}.window-card p{font-size:10px;line-height:1.45;color:#615b65;margin:0}.window-card .why{margin-top:10px;font-size:9px;font-weight:800;color:var(--ink)}
/* answers/final */
.answers{display:grid;gap:7px}.answer-card{box-shadow:none;overflow:hidden}.answer-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:17px 18px;text-align:left;cursor:pointer}.answer-btn strong{font-size:13px;letter-spacing:-.015em}.answer-plus{color:var(--purple);font-weight:950;font-size:18px}.answer-body{display:none;padding:0 18px 18px}.answer-card.open .answer-body{display:block}.answer-lead{font-size:13px;line-height:1.55;color:#504a55}.answer-lead strong{color:var(--purple);font-weight:950}
.final{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.final-main{padding:4px}.final-main h2{font-size:31px;letter-spacing:-.055em;margin:7px 0 12px}.final-main p{font-size:15px;line-height:1.65;color:#514c55;margin:0}.support-list{display:grid;gap:8px}.support{padding:14px 15px;border-radius:15px;background:#faf8fd;border:1px solid #e5def9}.support b{display:block;font-size:9px;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.support span{font-size:10px;line-height:1.45;color:#5d5761}.footer{margin-top:28px;color:#8b8590;font-size:9px;line-height:1.5;border-top:1px solid var(--line);padding-top:15px}
.empty{max-width:620px;margin:15vh auto;text-align:center}.empty h1{font-size:52px;letter-spacing:-.06em;margin:10px 0}.empty p{color:var(--muted)}.empty button{border:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:900;cursor:pointer}
.free-volume-stack,.free-chart-stack{display:grid;grid-template-columns:1fr;gap:14px}.free-volume-panel{width:100%}.free-volume-stack .participation-panel{width:100%}.free-chart-stack .free-panel{width:100%}.free-small-chart{height:300px;margin-top:12px}.free-main-chart{height:390px}.free-mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.free-mini{min-height:82px;display:flex;flex-direction:column;justify-content:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:17px}.free-mini b{font-size:9px;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}.free-mini span{font-size:12px;line-height:1.35;margin-top:6px}.free-chart-stack .free-panel{min-height:0}.free-chart-stack .chart-help{margin-top:12px}.year-tick{font-weight:900}
.chart-year-divider{stroke:#c9c3d2;stroke-width:1.4;stroke-dasharray:4 4;opacity:.95}.chart-year-label{font-size:12px;font-weight:900;fill:#6d4df6;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}

@media(max-width:900px){.hero,.grid-main,.final{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.signal-cards{grid-template-columns:repeat(3,1fr)}.intervention{grid-template-columns:1fr}.turn-grid,.evidence-grid{grid-template-columns:1fr}.pattern-grid{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:8px}.ba-row{grid-template-columns:120px 1fr 85px}}
@media(max-width:620px){main{padding:18px 4vw 60px}.topbar{padding:0 4vw}.hero-main{padding:27px 24px}.hero-main h1{font-size:50px}.kpis{grid-template-columns:1fr 1fr}.signal-cards{grid-template-columns:repeat(2,1fr)}.pattern-grid{grid-template-columns:1fr}.ba-row{grid-template-columns:1fr;gap:6px}.ba-values{text-align:left}.volume-chart{gap:3px}.vwrap{min-width:22px}.vmonth{font-size:7px}.vbar{width:75%}}

.insight-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}.insight-head h2{margin:5px 0 0;font-size:31px;letter-spacing:-.055em}.insight-head p{margin:0;max-width:430px;color:#c7c1cf;font-size:11px;line-height:1.5}

.diagnosis-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.diagnosis-main{background:linear-gradient(145deg,#eee9ff,#fff);border:1px solid #ddd4ff;border-radius:22px;padding:24px}.diagnosis-main h3{font-size:24px;line-height:1.1;letter-spacing:-.05em;margin:8px 0 12px}.diagnosis-main p{font-size:12px;line-height:1.65;color:#514c55;margin:0 0 14px}.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chain span{background:#fff;border:1px solid #ddd4ff;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900;color:#4e4470}.chain i{font-style:normal;color:var(--purple);font-weight:900}.driver-list{display:grid;gap:7px}.driver{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}.driver b{font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}.driver p{font-size:10px;line-height:1.45;color:var(--muted);margin:4px 0 0}.contrib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.contrib{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.contrib .who{font-size:13px;font-weight:950}.contrib .impact{font-size:11px;line-height:1.5;color:#514c55;margin-top:7px}.contrib .confidence-line{font-size:9px;color:var(--purple);font-weight:900;margin-top:9px}

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)};
const monthShort=m=>{const [y,mo]=String(m).split('-');const d=new Date(Number(y),Number(mo)-1,1);const l=typeof reportLang==='function'?reportLang():(localStorage.getItem('after-language')||'en');const locale={en:'en-US',ru:'ru-RU',es:'es-ES',it:'it-IT',de:'de-DE'}[l]||'en-US';return d.toLocaleDateString(locale,{month:'short'}).toUpperCase()};
const datePretty=s=>{if(!s)return '—';const d=new Date(String(s).length<=10?s+'T12:00:00':s);return isNaN(d)?String(s):d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'})};
const chartDateLabel=v=>{const raw=String(v||'');if(!raw)return '—';try{const langMap={en:'en-US',ru:'ru-RU',es:'es-ES',it:'it-IT',de:'de-DE'};const lang=typeof reportLang==='function'?reportLang():'en';if(/^\d{4}-\d{2}$/.test(raw)){const d=new Date(raw+'-01T12:00:00');return new Intl.DateTimeFormat(langMap[lang]||'en-US',{month:'long',year:'numeric'}).format(d)}if(/^\d{4}$/.test(raw))return raw;const d=new Date(raw.length<=10?raw+'T12:00:00':raw);return isNaN(d)?raw:new Intl.DateTimeFormat(langMap[lang]||'en-US',{day:'2-digit',month:'short',year:'numeric'}).format(d)}catch(e){return raw}};
function showChartTip(el,ev){const tip=document.getElementById('chartTooltip');if(!tip)return;tip.innerHTML=el.getAttribute('data-chart-tip')||'';tip.style.display='block';positionChartTip(ev)}
function positionChartTip(ev){const tip=document.getElementById('chartTooltip');if(!tip)return;const pad=14;let x=ev.clientX+14,y=ev.clientY+14;const r=tip.getBoundingClientRect();if(x+r.width>window.innerWidth-pad)x=ev.clientX-r.width-14;if(y+r.height>window.innerHeight-pad)y=ev.clientY-r.height-14;tip.style.left=Math.max(pad,x)+'px';tip.style.top=Math.max(pad,y)+'px'}
function hideChartTip(){const tip=document.getElementById('chartTooltip');if(tip)tip.style.display='none'}
document.addEventListener('mouseover',e=>{const el=e.target.closest?.('[data-chart-tip]');if(el)showChartTip(el,e)});document.addEventListener('mousemove',e=>{if(document.getElementById('chartTooltip')?.style.display==='block')positionChartTip(e)});document.addEventListener('mouseout',e=>{const el=e.target.closest?.('[data-chart-tip]');if(el&&!el.contains(e.relatedTarget))hideChartTip()});document.addEventListener('scroll',hideChartTip,true);
// Safari can throw "The string did not match the expected pattern" when
// URLSearchParams receives a malformed percent-encoded query. Do not let that
// prevent the report from loading. The job id generated by After is hex-only,
// so a tiny manual parser is both safer and sufficient here.
function getJobId(){
  try{
    const q=String(location.search||'');
    const m=q.match(/[?&]job=([^&]*)/);
    if(m) return decodeURIComponent(m[1]);
  }catch(e){ console.warn('Could not read report job id from URL',e); }
  try{return sessionStorage.getItem('afterReportJobId')||null}catch(e){return null}
}
const reportJobId=getJobId();
let payload=null;
// If this URL contains a job id, always load that job rather than a stale
// report left in sessionStorage from an earlier analysis.
if(!reportJobId){
  try{payload=JSON.parse(sessionStorage.getItem('afterReport')||'null')}catch(e){payload=null}
}
async function loadReportPayload(){
  if(payload) return true;
  if(!reportJobId) return false;
  try{
    const resp=await fetch('/analysis/'+encodeURIComponent(reportJobId),{cache:'no-store'});
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.detail||'Could not load report');
    if((data.status==='complete'||data.status==='ai_complete') && data.result){
      payload=data.result;
      try{sessionStorage.setItem('afterReport',JSON.stringify(payload));}catch(_){ }
      return true;
    }
    if(data.status==='error'||data.status==='ai_error') throw new Error(data.error||data.result?.ai_error||'Analysis failed');
    return false;
  }catch(e){
    console.error('Report loading failed:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="eyebrow">After · Report</div><h1>Could not load the report.</h1><p>'+esc(e.message||'Unknown error')+'</p><button onclick="location.href='/'">Back to analysis</button></div>';
    return false;
  }
}
function escProse(text){
 let s=esc(text||'');
 s=s.replace(/\b(early March|late March|early April|late April|early May|late May|early June|late June|early July|late July|early August|late August|February|March|April|May|June|July|August|26 February|26 Feb|6 August|6 Aug)\b/gi,'<span class="date-accent">$1</span>');
 s=s.replace(/\b(structural shift|high-frequency communication|reciprocity|repair|future-oriented language|future plans|affection|communication intensity|pulling away|turning point|intervention window|relationship end|breakup|negative relationship end)\b/gi,'<span class="accent">$1</span>');
 return s;
}
function signalChart(points,shiftIndex){
 if(!points.length)return '<div class="muted" style="padding:35px 0">Not enough timeline data.</div>';
 const W=1100,H=330,L=54,R=22,T=24,B=72,iw=W-L-R,ih=H-T-B;
 const xy=points.map((p,i)=>({x:L+(points.length===1?iw/2:iw*i/(points.length-1)),y:T+ih-(Math.max(0,Math.min(100,Number(p.signal||0)))/100)*ih,p}));
 const grid=[0,25,50,75,100].map(v=>{const y=T+ih-(v/100)*ih;return `<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-label" x="${L-10}" y="${y+3}" text-anchor="end">${v}</text>`}).join('');
 const path=xy.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');

 en:{button:'How to read this chart',means:'What it means:',look:'What to look for:',volume:{title:'How to read this chart',meaning:'This shows how communication volume or word volume changed over the selected time resolution. Each line represents one participant.',watch:'Look for sustained rises or falls, divergence between the two people, sudden bursts, and long periods of low activity. A volume change is not by itself evidence of stronger or weaker feelings.'},response:{title:'How to read this chart',meaning:'This tracks the average time it took each participant to reply after the other person wrote. Very long gaps are capped in the response metric.',watch:'Look for a persistent increase in one person’s waiting time, widening differences between the two lines, or a sudden change that lasts across several periods.'},length:{title:'How to read this chart',meaning:'This shows average words per message for each participant over time. It captures whether messages became more compressed or more elaborate.',watch:'Look for sustained shortening, especially if it happens together with slower replies or lower switching between speakers. Longer messages can also reflect conflict or practical discussion, so context matters.'},heat:{title:'How to read this chart',meaning:'Each cell shows how many messages occurred in a particular weekday and hour. Darker cells represent denser conversation periods.',watch:'Look for the times when contact was concentrated, whether that rhythm changed elsewhere in the archive, and whether communication became limited to short recurring windows.'},balance:{title:'How to read this chart',meaning:'Reciprocity balance summarizes how evenly message volume was distributed between the two participants. The second line shows one participant’s share for comparison.',watch:'Look for a sustained drop in balance and for periods where one participant’s share moves away from the midpoint. One busy week alone is less important than a persistent shift.'},turn:  ru:{button:'Как читать этот график',means:'Что это значит:',look:'На что смотреть:',volume:{title:'Как читать этот график',meaning:'График показывает, как менялся объём сообщений или слов на выбранном масштабе времени. Каждая линия соответствует одному участнику.',watch:'Смотрите на устойчивый рост или спад, расхождение линий, резкие всплески и длинные периоды низкой активности. Сам по себе объём не доказывает усиление или ослабление чувств.'},response:{title:'Как читать этот график',meaning:'Показывает среднее время, которое каждому участнику требовалось, чтобы ответить после сообщения другого человека. Очень длинные паузы ограничены в метрике ответа.',watch:'Смотрите на устойчивый рост времени ожидания одного человека, увеличение разрыва между линиями или резкое изменение, сохраняющееся несколько периодов.'},length:{title:'Как читать этот график',meaning:'Показывает среднее количество слов в сообщении каждого участника во времени и помогает увидеть, стали ли сообщения короче или подробнее.',watch:'Смотрите на устойчивое сокращение сообщений, особенно вместе с более медленными ответами или меньшим переключением между собеседниками. Длинные сообщения также могут быть связаны с конфликтом или практическими вопросами.'},heat:{title:'Как читать эту карту',meaning:'Каждая ячейка показывает количество сообщений в конкретный день недели и час. Более насыщенные ячейки означают более плотное общение.',watch:'Смотрите, когда общение было наиболее концентрированным, менялся ли этот ритм со временем и не ограничилось ли общение короткими повторяющимися окнами.'},balance:{title:'Как читать этот график',meaning:'Баланс взаимности показывает, насколько равномерно распределялся объём сообщений между двумя участниками. Вторая линия показывает долю одного участника для сравнения.',watch:'Смотрите на устойчивое снижение баланса и периоды, когда доля одного участника заметно уходит от середины. Один загруженный период менее важен, чем устойчивый сдвиг.'},turn:{title:'Как читать этот  it:{button:'Come leggere questo grafico',means:'Cosa significa:',look:'Cosa osservare:',volume:{title:'Come leggere questo grafico',meaning:'Mostra come è cambiato il volume di messaggi o parole nella scala temporale selezionata. Ogni linea rappresenta una persona.',watch:'Osserva aumenti o cali persistenti, divergenze tra le due persone, picchi improvvisi e lunghi periodi di bassa attività. Il volume da solo non dimostra sentimenti più forti o più deboli.'},response:{title:'Come leggere questo grafico',meaning:'Mostra il tempo medio impiegato da ciascuna persona per rispondere dopo il messaggio dell’altra. Le pause molto lunghe sono limitate nella metrica.',watch:'Osserva un aumento persistente del tempo di attesa, una distanza crescente tra le linee o un cambiamento improvviso che dura per più periodi.'},length:{title:'Come leggere questo grafico',meaning:'Mostra la media delle parole per messaggio di ciascuna persona nel tempo.',watch:'Osserva una riduzione persistente, soprattutto insieme a risposte più lente o a meno cambi di turno. I messaggi più lunghi possono anche riflettere conflitti o questioni pratiche.'},heat:{title:'Come leggere questa mappa',meaning:'Ogni cella mostra quanti messaggi sono stati inviati in una specifica combinazione di giorno e ora. Le celle più intense indicano periodi di conversazione più densi.',watch:'Osserva quando il contatto era concentrato, se il ritmo è cambiato e se la comunicazione si è limitata a brevi finestre ricorrenti.'},balance:{title:'Come leggere questo grafico',meaning:'Il bilanciamento della reciprocità riassume quanto il volume dei messaggi fosse distribuito tra le due persone. La seconda linea mostra la quota di una persona per confronto.',watch:'Osserva un calo persistente del bilanciamento e i periodi in cui la quota di una persona si allontana dal punto centrale.'},turn:{title:'Come leggere questo grafico',meaning:'Il tasso di cambio misura quanto spesso la conversazione passa da una persona all’altra. La seconda linea mostra la lunghezza media delle sequenze dello stesso interlocutore.',watch:'Osserva un calo del tasso di cambio insieme a sequenze più lunghe dello stesso interlocutore. Indica una conversazione meno alternata e più raggruppata.'},silence:{title:'Come leggere questo grafico',meaning:'Le due linee separano l’attesa normale dai silenzi insolitamente lunghi: la mediana mostra la pausa tipica e il 90° percentile mostra la parte lunga della distribuzione.',watch:'Osserva se aumenta l’attesa tipica, se la linea superiore cresce molto più rapidamente o entrambe le cose.'},signal:{title:'Come leggere questo grafico',meaning:'È un indice osservabile della comunicazione costruito sui marcatori dell’archivio. Mostra cambiamenti strutturali, non misura amore o sentimenti privati.',watch:'Osserva movimenti persistenti, non un singolo punto. Il marker di cambiamento strutturale evidenzia il periodo considerato importante dall’analisi approfondita.'},messageVolume:{title:'Come leggere questo grafico',meaning:'Ogni barra mostra il numero totale di messaggi del mese. Le barre mostrano l’intensità della comunicazione, non la qualità della relazione.',watch:'Osserva aumenti o cali persistenti, rotture improvvise del modello e se il cambiamento dura per più mesi.'}},

 <section class="section"><div class="section-head"><div><div class="eyebrow">01 · Communication</div><h2>What changed over time?</h2></div><p>One visual story first. The numbers describe observable communication patterns — not love.</p></div>
  <div class="grid-main"><div class="panel"><div class="eyebrow">Relationship signal over time</div><h3>Open → connected → structural shift</h3><p class="panel-sub">A 0–100 observable communication index built from reciprocity, repair, future-oriented language and affection markers.</p><div class="signal-wrap">${signalChart(timeline,shiftIndex)}</div><div class="signal-cards">${sigCards}</div>${chartHelp('signal')}</div>
  <div class="panel participation"><div><div class="eyebrow">Participation</div><h3>Who carried the volume?</h3><p class="panel-sub">Share of all parsed messages.</p></div><div class="donut" style="background:conic-gradient(var(--purple) 0 ${p0Share*3.6}deg,#ddd8e6 ${p0Share*3.6}deg 360deg)"><div class="donut-center"><div><strong>${p0Share}%</strong><span>${esc(p0)}</span></div></div></div><div><div class="person-row"><span class="person-name"><i class="sw"></i>${esc(p0)}</span><b>${p0Share}%</b></div><div class="person-row"><span class="person-name"><i class="sw alt"></i>${esc(p1)}</span><b>${p1Share}%</b></div></div></div></div>
  <div class="panel volume"><div class="eyebrow">Message volume</div><h3>Communication intensity by month</h3><p class="panel-sub">Months are distributed evenly so the timeline remains readable.</p><div class="volume-chart">${monthly.slice(-12).map(x=>`<div class="vwrap"><div class="vbar chart-target" data-chart-tip="<b>${esc(chartDateLabel(x.month))}</b><div>Messages: <strong>${esc(x.messages)}</strong></div>" style="height:${Math.max(2,Number(x.messages||0)/volMax*100)}%"><span class="vvalue">${compact(x.messages)}</span></div><span class="vmonth">${esc(monthShort(x.month))}</span></div>`).join('')}</div>${chartHelp('messageVolume')}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">02 · Recurring contact</div><h2>The routines that repeated.</h2></div><p>These are counted from the full archive. A repeated ritual is observable; its emotional meaning is interpreted separately.</p></div><div class="ritual-grid">${ritualCards||'<div class="muted">No recurring contact rituals were detected strongly enough to display.</div>'}</div></section>
 '' '
<section class="section"><div class="section-head"><div><div class="eyebrow">02 · Change</div><h2>What actually changed?</h2></div><p>Instead of four confusing lines, compare the communication markers directly.</p></div>
  <div class="panel"><div class="ba-grid">${metrics.map(m=>`<div class="ba-row"><div class="ba-name">${esc(m.metric)}</div><div class="ba-track"><i class="ba-before" style="width:${Math.max(0,Math.min(100,Number(m.before_value||0)))}%"></i><i class="ba-after" style="width:${Math.max(0,Math.min(100,Number(m.after_value||0)))}%"></i></div><div class="ba-values"><span>${esc(m.before_value)}</span> <span class="ba-key">→ ${esc(m.after_value)}</span></div></div>`).join('')||'<div class="muted">No before/after metrics returned.</div>'}</div><div class="ba-note"><b>Gray = before</b> · <span style="color:var(--purple);font-weight:900">purple = after</span> · all four measures are observable communication markers, not feelings.</div></div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">03 · Relationship arc</div><h2>How the relationship evolved.</h2></div><p>A compressed timeline keeps the story readable while preserving the original AI summaries.</p></div>
  <div class="story-timeline">${phaseCards||'<div class="muted">No relationship phases returned.</div>'}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">04 · Turning points</div><h2>Where the story changed.</h2></div><p>Short cards. Date first. Change second. Meaning last.</p></div>
  <div class="turn-grid">${turns.slice(0,8).map((t,i)=>`<article class="turn-card"><div class="date">${esc(t.date||'Turning point '+(i+1))}</div><h3>${esc(t.title||'Turning point')}</h3><p>${esc(t.what_changed||t.why_it_matters||'')}</p><span class="badge">turning point</span></article>`).join('')||'<div class="muted">No sufficiently supported turning points returned.</div>'}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">05 · Patterns</div><h2>The loops underneath the story.</h2></div></div>
  <div class="grid-main"><div class="panel"><div class="eyebrow">Recurring patterns</div><h3>What repeated?</h3><div class="pattern-grid">${(r.recurring_loops||[]).slice(0,6).map((x,i)=>`<div class="mini-card"><div class="n">0${i+1}</div><p>${esc(x)}</p></div>`).join('')||'<div class="mini-card"><p>No sufficiently supported recurring loops returned.</p></div>'}</div></div><div class="panel"><div class="eyebrow">Repair attempts</div><h3>What happened after conflict?</h3><div class="repair-grid">${(r.repair_attempts||[]).slice(0,6).map((x,i)=>`<div class="repair-row"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')||'<div class="repair-row"><span>No sufficiently supported repair observations returned.</span></div>'}</div></div></div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">06 · Evidence</div><h2>The exact messages behind the conclusion.</h2></div><p>Speaker, date, message, then the explanation. Nothing is hidden inside a wall of text.</p></div>
  <div class="evidence-grid">${evidence.slice(0,8).map(e=>`<article class="evidence-card"><div class="evidence-head"><span class="speaker">${esc(e.speaker||'Unknown')}</span><span class="evidence-date">${esc(e.date||'')}</span></div><div class="quote">${esc(e.quote||'')}</div><div class="meaning"><div class="meaning-label">What this shows</div><p>${esc(e.context||e.interpretation||'')}</p></div><div class="more-meaning meaning"><div class="meaning-label">Why it matters</div><p>${esc(e.interpretation||'')}</p></div><button class="evidence-toggle" type="button">Show interpretation +</button></article>`).join('')||'<div class="muted">No evidence items returned.</div>'}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">07 · Intervention</div><h2>When could something realistically have been done?</h2></div><p>Green = stronger opportunity. Amber = uncertain. Red = likely too late.</p></div>
  <div class="intervention">${windows.slice(0,6).map((w,i)=>`<article class="window-card ${windowClass(w,i)}"><div class="window-date">${esc(w.period||'Period')}</div><span class="status">${esc(w.type||w.assessment||'window')}</span><h3>${esc(w.assessment||w.type||'Intervention window')}</h3><p>${esc(w.reason||'')}</p><div class="why">${esc(w.what_could_have_helped||'')}</div></article>`).join('')||'<div class="muted">No intervention windows returned.</div>'}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">08 · The questions that matter</div><h2>So… why did it end?</h2></div><p>Direct answers with calibrated confidence. No invented certainty.</p></div>
  <div class="answers">${answers.map((x,i)=>`<article class="answer-card ${i===0?'open':''}"><button class="answer-btn" type="button"><strong>${esc(x.question||'Question')}</strong><span class="answer-plus">+</span></button><div class="answer-body"><div class="answer-lead">${escProse(x.answer||'')} ${x.confidence?`<br><span class="micro">Confidence · ${esc(x.confidence)}</span>`:''}</div></div></article>`).join('')||'<div class="muted">No breakup questions returned.</div>'}</div>
 </section>

 <section class="section"><div class="section-head"><div><div class="eyebrow">09 · Final read</div><h2>What the archive actually supports.</h2></div></div>
  <div class="panel final"><div class="final-main"><div class="eyebrow">The short version</div><h2>${esc(shift.title||'A relationship changed before it ended.')}</h2><p>${escProse(first)}</p></div><div class="support-list"><div class="support"><b>Observable</b><span><strong>${esc(datePretty(shift.date))}</strong> is the strongest structural shift supported by the archive.</span></div><div class="support"><b>Not established</b><span>The archive does not prove another person's private reasoning or an affair without direct evidence.</span></div><div class="support"><b>How to read this</b><span>Repeated patterns across dates matter more than one dramatic message.</span></div><div class="support"><b>Not supported</b><span>${escProse((diagnosis.not_supported||[]).slice(0,2).join(" "))}</span></div></div></div>
 </section>
 <div class="footer">After separates measured communication behavior from interpretation. The report does not claim to know when someone stopped loving another person; it identifies when observable patterns changed and shows the evidence behind those conclusions.</div>`;

 document.querySelectorAll('.evidence-toggle').forEach(b=>b.onclick=()=>{const c=b.closest('.evidence-card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'Hide interpretation −':'Show interpretation +'});
 document.querySelectorAll('.answer-btn').forEach(b=>b.onclick=()=>{const c=b.closest('.answer-card');c.classList.toggle('open')});
 document.getElementById('pdfBtn').onclick=async()=>{const b=document.getElementById('pdfBtn');b.disabled=true;b.textContent='Preparing…';try{const resp=await fetch('/report/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!resp.ok){let e='PDF generation failed';try{const j=await resp.json();e=j.detail||e}catch(_){ }throw new Error(e)}const blob=await resp.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='after_relationship_report.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);b.textContent='Downloaded';setTimeout(()=>{b.textContent='Download PDF';b.disabled=false},1200)}catch(e){if(String(e.message||'').toLowerCase().includes('reportlab')||String(e.message||'').toLowerCase().includes('pdf support')){b.disabled=false;b.textContent='Print / Save as PDF';window.print();setTimeout(()=>{b.textContent='Download PDF'},1500)}else{alert(e.message);b.textContent='Download PDF';b.disabled=false}}};
}
loadReportPayload().then(ok=>{
  const lang=reportLang();
  document.documentElement.lang=lang;
  installLanguageObserver();
  render();
  installReportLanguage();
  translateReportText();
  requestAnimationFrame(()=>translateReportText());
});
</script>
</body>
</html>
