<title>after. — Relationship Report</title>
<style>
:root{
 --bg:#f7f6f3;--surface:#fff;--ink:#17151b;--muted:#77727d;--line:#e5e1e8;
 --purple:#6d4df6;--purple2:#eee9ff;--purple3:#cfc2ff;--green:#20815e;--green2:#e7f5ee;
 --amber:#b27a14;--amber2:#fff3d8;--red:#b64d5b;--red2:#fdebed;
 --shadow:0 16px 50px rgba(35,27,55,.07);--r:24px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}main{max-width:1240px;margin:auto;padding:26px 4.5vw 90px}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 4.5vw;background:rgba(247,246,243,.9);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{font-size:23px;font-weight:900;letter-spacing:-.06em}.brand i{color:var(--purple);font-style:normal}.top-actions{display:flex;gap:8px}.top-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:850;cursor:pointer}.top-actions .top-legal-link{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:850;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}.top-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.report-lang{display:flex;gap:3px;padding:3px;border:1px solid var(--line);background:#fff;border-radius:12px}.report-lang button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 7px;font-size:9px;font-weight:900;cursor:pointer}.report-lang button.active{background:var(--ink);color:#fff}.report-lang button:hover{color:var(--ink)}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--purple)}.muted{color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.75fr);gap:14px;margin-top:28px}.hero-main,.hero-side,.panel,.kpi,.story-card,.evidence-card,.answer-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}.hero-main{padding:36px 38px;background:radial-gradient(circle at 92% 12%,#eee9ff 0,rgba(238,233,255,0) 36%),#fff;min-height:292px}.hero-main h1{font-size:clamp(46px,7vw,82px);line-height:.88;letter-spacing:-.075em;margin:11px 0 17px;max-width:850px}.hero-main p{max-width:760px;color:var(--muted);font-size:15px;line-height:1.6;margin:0}.hero-side{display:grid;grid-template-rows:1fr auto;overflow:hidden}.shift{padding:28px}.shift-date{font-size:45px;font-weight:950;letter-spacing:-.07em;margin:9px 0 14px;color:var(--purple)}.shift-title{font-size:19px;font-weight:900;line-height:1.05;letter-spacing:-.035em}.shift-copy{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}.confidence{border-top:1px solid var(--line);padding:16px 20px;background:#fbfafc;font-size:10px;color:var(--muted);line-height:1.5}.confidence b{color:var(--ink)}
.hero-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.tag{font-size:10px;font-weight:850;padding:8px 10px;border-radius:999px;background:var(--purple2);color:var(--purple);border:1px solid #ddd5ff}.tag.neutral{background:#f5f3f0;color:#5e5962;border-color:#e7e2db}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.kpi{padding:17px 15px;box-shadow:none}.kpi strong{display:block;font-size:21px;letter-spacing:-.05em}.kpi span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-top:5px;font-weight:800}
.section{margin-top:52px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.section-head h2{font-size:31px;line-height:1;letter-spacing:-.06em;margin:6px 0 0}.section-head p{max-width:460px;color:var(--muted);font-size:11px;line-height:1.45;margin:0}.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.65fr);gap:12px}.panel{padding:25px;box-shadow:none}.panel h3{font-size:18px;letter-spacing:-.04em;margin:6px 0 5px}.panel-sub{font-size:10px;line-height:1.45;color:var(--muted);margin:0}
/* highlight language */
.prose{font-size:14px;line-height:1.7;color:#514c55}.prose strong,.highlight{font-weight:900;color:var(--ink)}.accent{color:var(--purple);font-weight:900;background:linear-gradient(transparent 62%,#e7e0ff 62%);padding:0 2px}.date-accent{color:var(--purple);font-weight:900}.micro{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}
/* signal chart */
.signal-wrap{margin-top:22px}.signal-svg{width:100%;height:auto;display:block}.gridline{stroke:#ebe7ee;stroke-width:1}.axis-label{font-size:9px;fill:#938d98}.signal-path{fill:none;stroke:var(--purple);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.signal-point{fill:#fff;stroke:var(--purple);stroke-width:3}.signal-value{font-size:11px;fill:var(--purple);font-weight:950}.shift-marker{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 5}.shift-marker-label{font-size:9px;fill:var(--red);font-weight:900}.month-label{font-size:10px;fill:#625d67;font-weight:850}.signal-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:13px}.signal-card{min-width:0;padding:10px 9px;border:1px solid var(--line);border-radius:13px;background:#fcfbfd}.signal-card .month{font-size:9px;font-weight:900;color:var(--purple);text-transform:uppercase}.signal-card .sig{font-size:20px;font-weight:950;letter-spacing:-.05em;margin-top:4px}.signal-card .desc{font-size:9px;line-height:1.35;color:var(--muted);margin-top:4px;min-height:25px}
/* participation */
.participation{display:flex;flex-direction:column;justify-content:space-between;height:100%}.donut{width:160px;height:160px;border-radius:50%;margin:14px auto 12px;position:relative;background:conic-gradient(var(--purple) 0 50%,#ddd8e6 50% 100%)}.donut:after{content:"";position:absolute;inset:31px;background:#fff;border-radius:50%}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}.donut-center strong{font-size:24px;letter-spacing:-.05em}.donut-center span{font-size:9px;color:var(--muted);display:block;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:11px}.person-row b{font-size:13px}.person-name{display:flex;align-items:center;gap:7px}.sw{width:8px;height:8px;border-radius:50%;background:var(--purple)}.sw.alt{background:#d9d3e0}
/* volume */
.volume{margin-top:12px}.volume-chart{height:250px;display:flex;align-items:flex-end;gap:8px;padding:0 2px 28px;border-bottom:1px solid var(--line)}.vwrap{height:100%;flex:1;min-width:35px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.vbar{width:min(40px,72%);background:linear-gradient(180deg,#7558fa,#a090ff);border-radius:9px 9px 3px 3px;position:relative;min-height:3px}.vbar:hover{filter:brightness(.95)}.vvalue{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:var(--purple)}.vmonth{margin-top:8px;font-size:9px;font-weight:850;color:#625d67;white-space:nowrap}
/* before after */
.ba-grid{display:grid;gap:14px}.ba-row{display:grid;grid-template-columns:160px minmax(0,1fr) 105px;align-items:center;gap:14px}.ba-name{font-size:11px;font-weight:900}.ba-track{height:25px;background:#f1eef3;border-radius:8px;position:relative;overflow:hidden}.ba-before{position:absolute;left:0;top:0;height:100%;background:#bcb5c4;border-radius:8px}.ba-after{position:absolute;left:0;bottom:0;height:100%;background:var(--purple);border-radius:8px;mix-blend-mode:multiply;opacity:.88}.ba-values{text-align:right;font-size:10px;font-weight:900}.ba-key{color:var(--purple)}.ba-note{font-size:9px;color:var(--muted);margin-top:15px}
/* story timeline */
.story-timeline{position:relative;padding:8px 0 0}.story-timeline:before{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:2px;background:#e4dff0}.story-card{position:relative;margin:0 0 10px 30px;padding:17px 18px;box-shadow:none}.story-card:before{content:"";position:absolute;left:-28px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 4px var(--purple2)}.story-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.story-date{font-size:9px;color:var(--purple);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.story-card h3{font-size:16px;margin:5px 0 7px;letter-spacing:-.035em}.story-card p{font-size:10px;line-height:1.5;color:var(--muted);margin:0;max-width:850px}.story-metric{font-size:10px;font-weight:900;background:var(--purple2);color:var(--purple);border-radius:999px;padding:6px 8px;white-space:nowrap}
/* turns */
.turn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.turn-card{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}.turn-card .date{font-size:9px;font-weight:900;color:var(--purple);text-transform:uppercase}.turn-card h3{font-size:15px;margin:7px 0 5px;letter-spacing:-.03em}.turn-card p{font-size:10px;line-height:1.45;color:var(--muted);margin:0}.turn-card .badge{display:inline-block;margin-top:10px;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);background:var(--purple2);padding:5px 7px;border-radius:999px}
/* recurring rituals */
.ritual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ritual-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.ritual-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.ritual-name{font-size:13px;font-weight:950;letter-spacing:-.025em}.ritual-count{font-size:22px;font-weight:950;color:var(--purple);letter-spacing:-.05em;white-space:nowrap}.ritual-meta{font-size:9px;color:var(--muted);margin-top:4px}.ritual-track{height:7px;background:#eeeaf3;border-radius:99px;margin:13px 0 8px;overflow:hidden}.ritual-bar{height:100%;background:var(--purple);border-radius:99px}.ritual-change{font-size:10px;line-height:1.45;color:var(--muted)}.ritual-change b{color:var(--ink)}.ritual-ai{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;line-height:1.45}.ritual-ai strong{color:var(--purple)}
@media(max-width:760px){.ritual-grid{grid-template-columns:1fr}}

/* patterns */
.pattern-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fcfbfd}.mini-card .n{font-size:9px;color:var(--purple);font-weight:950}.mini-card p{font-size:10px;line-height:1.45;margin:6px 0 0}.repair-grid{display:grid;gap:8px}.repair-row{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;padding:11px 12px;background:#f8f6fb;border-radius:12px}.repair-row b{width:22px;height:22px;border-radius:7px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:9px}.repair-row span{font-size:10px;line-height:1.45}

.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.evidence-card{padding:17px;box-shadow:none}.evidence-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.speaker{font-size:9px;font-weight:950;text-transform:uppercase;color:var(--purple);letter-spacing:.08em}.evidence-date{font-size:9px;color:var(--muted);font-weight:800}.quote{font-size:17px;line-height:1.4;letter-spacing:-.025em;font-weight:850;margin:15px 0 12px}.quote::before{content:'“';color:var(--purple);font-size:30px;vertical-align:-7px;margin-right:2px}.meaning{border-top:1px solid var(--line);padding-top:11px}.meaning-label{font-size:8px;color:var(--purple);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.meaning p{font-size:10px;color:var(--muted);line-height:1.45;margin:4px 0 0}.evidence-toggle{margin-top:10px;border:0;background:var(--purple2);color:var(--purple);font-size:9px;font-weight:900;padding:7px 9px;border-radius:8px;cursor:pointer}.more-meaning{display:none}.evidence-card.open .more-meaning{display:block}
/* intervention */
.intervention{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.window-card{border-radius:17px;padding:18px;border:1px solid var(--line);background:#fff}.window-card.green{background:var(--green2);border-color:#cfeade}.window-card.amber{background:var(--amber2);border-color:#f2dfb4}.window-card.red{background:var(--red2);border-color:#f2ccd1}.window-card .window-date{font-size:10px;font-weight:950}.window-card .status{display:inline-block;margin-top:7px;font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;padding:5px 7px;border-radius:999px;background:#fff}.window-card h3{font-size:16px;margin:11px 0 5px;letter-spacing:-.035em}.window-card p{font-size:10px;line-height:1.45;color:#615b65;margin:0}.window-card .why{margin-top:10px;font-size:9px;font-weight:800;color:var(--ink)}
/* answers/final */
.answers{display:grid;gap:7px}.answer-card{box-shadow:none;overflow:hidden}.answer-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;padding:17px 18px;text-align:left;cursor:pointer}.answer-btn strong{font-size:13px;letter-spacing:-.015em}.answer-plus{color:var(--purple);font-weight:950;font-size:18px}.answer-body{display:none;padding:0 18px 18px}.answer-card.open .answer-body{display:block}.answer-lead{font-size:13px;line-height:1.55;color:#504a55}.answer-lead strong{color:var(--purple);font-weight:950}
.final{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.final-main{padding:4px}.final-main h2{font-size:31px;letter-spacing:-.055em;margin:7px 0 12px}.final-main p{font-size:15px;line-height:1.65;color:#514c55;margin:0}.support-list{display:grid;gap:8px}.support{padding:14px 15px;border-radius:15px;background:#faf8fd;border:1px solid #e5def9}.support b{display:block;font-size:9px;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.support span{font-size:10px;line-height:1.45;color:#5d5761}.footer{margin-top:28px;color:#8b8590;font-size:9px;line-height:1.5;border-top:1px solid var(--line);padding-top:15px}
.empty{max-width:620px;margin:15vh auto;text-align:center}.empty h1{font-size:52px;letter-spacing:-.06em;margin:10px 0}.empty p{color:var(--muted)}.empty button{border:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:900;cursor:pointer}
.free-volume-stack,.free-chart-stack{display:grid;grid-template-columns:1fr;gap:14px}.free-volume-panel{width:100%}.free-volume-stack .participation-panel{width:100%}.free-chart-stack .free-panel{width:100%}.free-small-chart{height:300px;margin-top:12px}.free-main-chart{height:390px}.free-mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.free-mini{min-height:82px;display:flex;flex-direction:column;justify-content:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:17px}.free-mini b{font-size:9px;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}.free-mini span{font-size:12px;line-height:1.35;margin-top:6px}.free-chart-stack .free-panel{min-height:0}.free-chart-stack .chart-help{margin-top:12px}.year-tick{font-weight:900}
.chart-year-divider{stroke:#c9c3d2;stroke-width:1.4;stroke-dasharray:4 4;opacity:.95}.chart-year-label{font-size:12px;font-weight:900;fill:#6d4df6;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}

@media(max-width:900px){.hero,.grid-main,.final{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.signal-cards{grid-template-columns:repeat(3,1fr)}.intervention{grid-template-columns:1fr}.turn-grid,.evidence-grid{grid-template-columns:1fr}.pattern-grid{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:8px}.ba-row{grid-template-columns:120px 1fr 85px}}
@media(max-width:620px){main{padding:18px 4vw 60px}.topbar{padding:0 4vw}.hero-main{padding:27px 24px}.hero-main h1{font-size:50px}.kpis{grid-template-columns:1fr 1fr}.signal-cards{grid-template-columns:repeat(2,1fr)}.pattern-grid{grid-template-columns:1fr}.ba-row{grid-template-columns:1fr;gap:6px}.ba-values{text-align:left}.volume-chart{gap:3px}.vwrap{min-width:22px}.vmonth{font-size:7px}.vbar{width:75%}}

.insight-hero{margin-top:14px;background:linear-gradient(135deg,#17151b 0%,#26212f 100%);color:#fff;border-radius:28px;padding:28px;box-shadow:0 22px 65px rgba(35,27,55,.13)}
.insight-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}.insight-head h2{margin:5px 0 0;font-size:31px;letter-spacing:-.055em}.insight-head p{margin:0;max-width:430px;color:#c7c1cf;font-size:11px;line-height:1.5}
.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.insight-card{background:#fff;color:var(--ink);border-radius:18px;padding:17px;border:1px solid rgba(255,255,255,.12);min-height:190px;display:flex;flex-direction:column}.insight-card .ic-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.insight-card .ic-cat{font-size:8px;text-transform:uppercase;letter-spacing:.11em;font-weight:950;color:var(--purple)}.insight-card .ic-num{font-size:9px;font-weight:900;color:#a09aa5}.insight-card h3{font-size:15px;line-height:1.15;letter-spacing:-.035em;margin:12px 0 7px}.insight-card .finding{font-size:11px;line-height:1.5;color:#514c55}.insight-card .why{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);font-size:10px;line-height:1.4;color:var(--muted)}.insight-card .why b{color:var(--ink)}
.diagnosis-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.diagnosis-main{background:linear-gradient(145deg,#eee9ff,#fff);border:1px solid #ddd4ff;border-radius:22px;padding:24px}.diagnosis-main h3{font-size:24px;line-height:1.1;letter-spacing:-.05em;margin:8px 0 12px}.diagnosis-main p{font-size:12px;line-height:1.65;color:#514c55;margin:0 0 14px}.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chain span{background:#fff;border:1px solid #ddd4ff;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900;color:#4e4470}.chain i{font-style:normal;color:var(--purple);font-weight:900}.driver-list{display:grid;gap:7px}.driver{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}.driver b{font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}.driver p{font-size:10px;line-height:1.45;color:var(--muted);margin:4px 0 0}.contrib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.contrib{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.contrib .who{font-size:13px;font-weight:950}.contrib .impact{font-size:11px;line-height:1.5;color:#514c55;margin-top:7px}.contrib .confidence-line{font-size:9px;color:var(--purple);font-weight:900;margin-top:9px}

<main id="main"></main><div id="chartTooltip" class="chart-tooltip" role="status" aria-live="polite"></div><div id="messageModal" class="message-modal-backdrop" aria-hidden="true"><div class="message-modal" role="dialog" aria-modal="true" aria-labelledby="messageModalTitle"><div class="message-modal-head"><div><h3 id="messageModalTitle">Messages from this period</h3><p id="messageModalSub">Click a point to inspect the conversation.</p></div><button class="message-modal-close" id="messageModalClose" aria-label="Close">×</button></div><div class="message-modal-body"><div id="messageModalSummary" class="message-period-summary"></div><div id="messageList" class="message-list"></div></div></div></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)};
const REPORT_LOCALE={en:'en-US',ru:'ru-RU',es:'es-ES',it:'it-IT',de:'de-DE',hi:'hi-IN',pt:'pt-BR',fr:'fr-FR'};
const monthShort=m=>{const [y,mo]=String(m).split('-');const d=new Date(Number(y),Number(mo)-1,1);const l=typeof reportLang==='function'?reportLang():(localStorage.getItem('after-language')||'en');const locale=REPORT_LOCALE[l]||'en-US';return d.toLocaleDateString(locale,{month:'short'}).toUpperCase()};
const datePretty=s=>{if(!s)return '—';const d=new Date(String(s).length<=10?s+'T12:00:00':s);const lang=typeof reportLang==='function'?reportLang():'en';const locale=REPORT_LOCALE[lang]||'en-US';return isNaN(d)?String(s):d.toLocaleDateString(locale,{day:'2-digit',month:'short',year:'numeric'})};
const chartDateLabel=v=>{const raw=String(v||'');if(!raw)return '—';try{const lang=typeof reportLang==='function'?reportLang():'en';if(/^\d{4}-\d{2}$/.test(raw)){const d=new Date(raw+'-01T12:00:00');return new Intl.DateTimeFormat(REPORT_LOCALE[lang]||'en-US',{month:'long',year:'numeric'}).format(d)}if(/^\d{4}$/.test(raw))return raw;const d=new Date(raw.length<=10?raw+'T12:00:00':raw);return isNaN(d)?raw:new Intl.DateTimeFormat(REPORT_LOCALE[lang]||'en-US',{day:'2-digit',month:'short',year:'numeric'}).format(d)}catch(e){return raw}};
function showChartTip(el,ev){const tip=document.getElementById('chartTooltip');if(!tip)return;tip.innerHTML=el.getAttribute('data-chart-tip')||'';tip.style.display='block';positionChartTip(ev)}
function positionChartTip(ev){const tip=document.getElementById('chartTooltip');if(!tip)return;const pad=14;let x=ev.clientX+14,y=ev.clientY+14;const r=tip.getBoundingClientRect();if(x+r.width>window.innerWidth-pad)x=ev.clientX-r.width-14;if(y+r.height>window.innerHeight-pad)y=ev.clientY-r.height-14;tip.style.left=Math.max(pad,x)+'px';tip.style.top=Math.max(pad,y)+'px'}
function hideChartTip(){const tip=document.getElementById('chartTooltip');if(tip)tip.style.display='none'}
document.addEventListener('mouseover',e=>{const el=e.target.closest?.('[data-chart-tip]');if(el)showChartTip(el,e)});document.addEventListener('mousemove',e=>{if(document.getElementById('chartTooltip')?.style.display==='block')positionChartTip(e)});document.addEventListener('mouseout',e=>{const el=e.target.closest?.('[data-chart-tip]');if(el&&!el.contains(e.relatedTarget))hideChartTip()});document.addEventListener('scroll',hideChartTip,true);
// Safari can throw "The string did not match the expected pattern" when
// URLSearchParams receives a malformed percent-encoded query. Do not let that
// prevent the report from loading. The job id generated by after is hex-only,
// so a tiny manual parser is both safer and sufficient here.
function getJobId(){
  try{
    const q=String(location.search||'');
    const m=q.match(/[?&]job=([^&]*)/);
    if(m) return decodeURIComponent(m[1]);
  }catch(e){ console.warn('Could not read report job id from URL',e); }
  try{return sessionStorage.getItem('afterReportJobId')||null}catch(e){return null}
}
const AI_STATUS_FAILED={en:'AI analysis did not finish:',ru:'ИИ-анализ не завершился:',es:'El análisis de IA no se completó:',it:'L’analisi IA non è stata completata:',de:'Die KI-Analyse wurde nicht abgeschlossen:',hi:'AI विश्लेषण पूरा नहीं हुआ:',pt:'A análise de IA não foi concluída:',fr:'L’analyse IA n’a pas abouti:'};
function setAiRunStatus(message,progress=0,state='running'){
 const panel=document.getElementById('aiRunStatus'),text=document.getElementById('aiRunStatusText'),bar=document.getElementById('aiRunProgress');
 if(!panel||!text)return;
 const run=document.getElementById('runAiBtn');
 const isRunning=Boolean(message)&&state==='running';
 if(run){run.hidden=isRunning;run.style.display=isRunning?'none':'';}
 panel.hidden=!message;panel.dataset.state=state;text.textContent=message;
 if(bar)bar.value=Math.max(0,Math.min(100,Number(progress)||0));
}
async function resumeAiRunIfNeeded(){
 let pending;
 try{pending=JSON.parse(sessionStorage.getItem('afterAiRun')||'null')}catch(_){pending=null}
 if(!pending?.jobId||String(pending.jobId)!==String(payload?.analysis_id)||payload?.ai_report)return;
 const lang=reportLang(),copy=AI_PERIOD_UI[lang]||AI_PERIOD_UI.en;
 setAiRunStatus(copy.running,5);
 try{
  while(true){
   await new Promise(resolve=>setTimeout(resolve,1000));
   const response=await fetch('/analysis/'+encodeURIComponent(pending.jobId),{cache:'no-store'}),status=await response.json();
   if(!response.ok)throw new Error(status.detail||'AI analysis status failed');
   const progress=Math.round(Number(status.progress||0));
   setAiRunStatus(copy.running.replace(/…$/,' · '+progress+'%'),progress);
   if(status.status==='complete'||status.status==='ai_complete'){
    if(!status.result?.ai_report)throw new Error(status.error||status.result?.ai_error||'The server finished without an AI report.');
    payload=status.result;
    try{sessionStorage.setItem('afterReportJobId',String(payload.analysis_id));sessionStorage.setItem('afterReport',JSON.stringify(payload));sessionStorage.removeItem('afterAiRun');}catch(_){ }
    render();translateReportText();translateFreeReportStatic();
    return;
   }
   if(status.status==='error'||status.status==='ai_error')throw new Error(status.error||status.result?.ai_error||'AI analysis failed');
  }
 }catch(exception){
  try{sessionStorage.removeItem('afterAiRun')}catch(_){ }
  setAiRunStatus(`${AI_STATUS_FAILED[lang]||AI_STATUS_FAILED.en} ${exception.message}`,0,'error');
 }
}
const reportJobId=getJobId();
let payload=null;
// If this URL contains a job id, always load that job rather than a stale
// report left in sessionStorage from an earlier analysis.
if(!reportJobId){
  try{payload=JSON.parse(sessionStorage.getItem('afterReport')||'null')}catch(e){payload=null}
}
async function loadReportPayload(){
  if(payload) return true;
  if(!reportJobId) return false;
  // A completed AI result is cached from the final status response. Prefer the
  // matching cache on reload so it survives a server worker/reloader restart.
  try{
    const cached=JSON.parse(sessionStorage.getItem('afterReport')||'null');
    if(cached && String(cached.analysis_id||'')===String(reportJobId) && cached.ai_report){
      payload=cached;
      return true;
    }
  }catch(_){ }
  try{
    const resp=await fetch('/analysis/'+encodeURIComponent(reportJobId),{cache:'no-store'});
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.detail||'Could not load report');
    if((data.status==='complete'||data.status==='ai_complete') && data.result){
      payload=data.result;
      // Keep the report server-side and persist only its lightweight job id.
      // Serializing a large archive into sessionStorage can exceed browser quotas.
      try{sessionStorage.setItem('afterReportJobId',reportJobId);sessionStorage.removeItem('afterReport');}catch(_){ }
      return true;
    }
    if(data.status==='error'||data.status==='ai_error') throw new Error(data.error||data.result?.ai_error||'Analysis failed');
    return false;
  }catch(e){
    console.error('Report loading failed:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="eyebrow">after · Report</div><h1>Could not load the report.</h1><p>'+esc(e.message||'Unknown error')+'</p><button onclick="location.href=\'/\'">Back to analysis</button></div>';
    return false;
  }
}
function escProse(text){
 let s=esc(text||'');
 s=s.replace(/\[\[([^\[\]\n]{1,100})\]\]/g,'<strong class="ai-keyphrase">$1</strong>').replace(/\[\[|\]\]/g,'');
 s=s.replace(/\b(early March|late March|early April|late April|early May|late May|early June|late June|early July|late July|early August|late August|February|March|April|May|June|July|August|26 February|26 Feb|6 August|6 Aug)\b/gi,'<span class="date-accent">$1</span>');
 s=s.replace(/\b(structural shift|high-frequency communication|reciprocity|repair|future-oriented language|future plans|affection|communication intensity|pulling away|turning point|intervention window|relationship end|breakup|negative relationship end)\b/gi,'<span class="accent">$1</span>');
 return s;
}
function timelineMessageCount(point){
 const own=Number(point?.message_count);
 if(Number.isFinite(own))return own;
 const rows=payload?.ai_analysis?.monthly_relationship_metrics||payload?.analysis?.monthly_relationship_metrics||[];
 const keys=String(point?.period||point?.start_date||'').match(/\d{4}-\d{2}/g)||[];
 if(!keys.length||!rows.length)return null;
 return rows.filter(row=>keys.includes(String(row.month||''))).reduce((sum,row)=>sum+Number(row.messages||0),0);
}
function timelineMetricAvailable(point,key){
 const value=point?.[key],count=timelineMessageCount(point);
 return value!==null&&value!==undefined&&Number.isFinite(Number(value))&&(count===null||count>=30);
}
function timelineDateLabel(value){const raw=String(value||'');const months=raw.match(/\d{4}-\d{2}/g)||[];if(months.length>1){const first=months[0],last=months[months.length-1];return `${monthShort(first)} ${first.slice(0,4)} – ${monthShort(last)} ${last.slice(0,4)}`}return chartDateLabel(raw)}
function signalChart(points,shiftIndex){
 if(!points.length)return `<div class="muted" style="padding:35px 0">${esc(aiReportText('Not enough timeline data.'))}</div>`;
 const W=1100,H=330,L=54,R=22,T=24,B=72,iw=W-L-R,ih=H-T-B;
 const xy=points.map((p,i)=>{const usable=timelineMetricAvailable(p,'signal'),value=usable?Number(p.signal):null;return {x:L+(points.length===1?iw/2:iw*i/(points.length-1)),y:usable?T+ih-(Math.max(0,Math.min(100,value))/100)*ih:T+ih,p,value,usable}});
 const grid=[0,25,50,75,100].map(v=>{const y=T+ih-(v/100)*ih;return `<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-label" x="${L-10}" y="${y+3}" text-anchor="end">${v}</text>`}).join('');
 const paths=[];let segment=[];for(const point of xy){if(point.usable)segment.push(point);else{if(segment.length>1)paths.push(segment);segment=[]}}if(segment.length>1)paths.push(segment);
 const path=paths.map(group=>`<path class="signal-path" d="${group.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')}"/>`).join('');
 const shift=shiftIndex>=0&&xy[shiftIndex]?.usable?xy[shiftIndex]:null;
 const marker=shift?`<line class="shift-marker" x1="${shift.x}" x2="${shift.x}" y1="${T}" y2="${T+ih}"/><text class="shift-marker-label" x="${Math.min(W-55,shift.x+7)}" y="${T+12}">${esc(aiReportText('STRUCTURAL SHIFT'))}</text>`:'';
 const pts=xy.map((p,i)=>{const d=timelineDateLabel(p.p.period||p.p.start_date),raw=p.p.period||p.p.start_date||'',count=timelineMessageCount(p);if(!p.usable){const low=aiReportText('Too few messages for a reliable score');const tip=`<b>${esc(d)}</b><div>${esc(low)}${count===null?'':` (${count} ${esc(aiReportText('messages'))})`}</div>`;return `<g><circle class="signal-point signal-missing chart-target" data-chart-tip="${esc(tip)}" data-chart-raw="${esc(raw)}" data-chart-type="month" data-chart-label="${esc(d)}" data-chart-metric="${esc(aiReportText('Relationship signal'))}" data-chart-value="—" cx="${p.x}" cy="${p.y}" r="5"/><text class="signal-missing-label" x="${p.x}" y="${p.y-13}" text-anchor="middle">—</text><text class="month-label" x="${p.x}" y="${H-43}" text-anchor="middle">${esc(monthShort(raw.slice(0,7)))}</text></g>`}const tip=`<b>${esc(d)}</b><div>${esc(aiReportText('Relationship signal'))}: <strong>${Math.round(p.value)}/100</strong></div><div class="tip-muted">${count===null?'':`${count} ${esc(aiReportText('messages'))}`}</div>`;return `<g><circle class="signal-point chart-target" data-chart-tip="${esc(tip)}" data-chart-raw="${esc(raw)}" data-chart-type="month" data-chart-label="${esc(d)}" data-chart-metric="${esc(aiReportText('Relationship signal'))}" data-chart-value="${Math.round(p.value)}" cx="${p.x}" cy="${p.y}" r="6"/><text class="signal-value" x="${p.x}" y="${p.y-13}" text-anchor="middle">${Math.round(p.value)}</text><text class="month-label" x="${p.x}" y="${H-43}" text-anchor="middle">${esc(monthShort(raw.slice(0,7)))}</text></g>`}).join('');
 return `<svg class="signal-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aiReportText('Relationship signal'))}">${grid}${marker}${path}${pts}</svg>`;
}
function warmthChart(points){
 const rows=points.map(p=>({p,value:timelineMetricAvailable(p,'affection_share')?Number(p.affection_share):null,count:timelineMessageCount(p)}));
 if(!rows.some(row=>row.value!==null))return `<div class="chart-empty">${esc(aiReportText('Not enough messages for a reliable warmth trend'))}</div>`;
 const W=1100,H=205,L=54,R=22,T=18,B=48,iw=W-L-R,ih=H-T-B,max=Math.max(5,Math.ceil(Math.max(...rows.map(row=>row.value??0))/5)*5);
 const xy=rows.map((row,i)=>({x:L+(rows.length===1?iw/2:iw*i/(rows.length-1)),y:row.value===null?T+ih:T+ih-row.value/max*ih,...row}));
 const grid=[0,max/2,max].map(value=>{const y=T+ih-value/max*ih;return `<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-label" x="${L-10}" y="${y+3}" text-anchor="end">${Number(value.toFixed(1))}%</text>`}).join('');
 const groups=[];let current=[];for(const point of xy){if(point.value!==null)current.push(point);else{if(current.length>1)groups.push(current);current=[]}}if(current.length>1)groups.push(current);
 const paths=groups.map(group=>{const d=group.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' '),area=`${d} L${group[group.length-1].x} ${T+ih} L${group[0].x} ${T+ih} Z`;return `<path class="warmth-area" d="${area}"/><path class="warmth-path" d="${d}"/>`}).join('');
 const dots=xy.map(row=>{
  const raw=row.p.period||row.p.start_date||'',d=timelineDateLabel(raw),label=aiReportText('Affectionate-language messages');
  const tip=row.value===null
   ? `<b>${esc(d)}</b><div>${esc(aiReportText('Too few messages for a reliable score'))}${row.count===null?'':` (${row.count} ${esc(aiReportText('messages'))})`}</div>`
   : `<b>${esc(d)}</b><div>${esc(label)}: <strong>${row.value}%</strong></div><div class="tip-muted">${row.count===null?'':`${row.count} ${esc(aiReportText('messages'))}; ${esc(aiReportText('not a measure of feelings'))}`}</div>`;
  return `<g><circle class="warmth-point${row.value===null?' signal-missing':''} chart-target" data-chart-tip="${esc(tip)}" data-chart-raw="${esc(raw)}" data-chart-type="month" data-chart-label="${esc(d)}" data-chart-metric="${esc(label)}" data-chart-value="${row.value===null?'—':row.value+'%'}" cx="${row.x}" cy="${row.y}" r="${row.value===null?4:5}"/><text class="month-label" x="${row.x}" y="${H-15}" text-anchor="middle">${esc(monthShort(raw.slice(0,7)))}</text>${row.value===null?`<text class="signal-missing-label" x="${row.x}" y="${row.y-10}" text-anchor="middle">—</text>`:`<text class="warmth-value" x="${row.x}" y="${row.y-10}" text-anchor="middle">${row.value}%</text>`}</g>`;
 }).join('');
 return `<svg class="warmth-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aiReportText('Warmth in the words'))}">${grid}<defs><linearGradient id="warmthFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9b7cff" stop-opacity=".28"/><stop offset="1" stop-color="#9b7cff" stop-opacity=".02"/></linearGradient></defs>${paths}${dots}</svg>`;
}
function windowClass(w,i){const t=((w.type||w.assessment||'')+' '+(w.reason||'')).toLowerCase();if(/high|strong|early|possible/.test(t)&&!(/unlikely|low/.test(t)))return i===2?'amber':'green';if(/unlikely|late|too late|low/.test(t))return 'red';return 'amber'}
function reportLang(){
 const supported=['en','ru','es','it','de','hi','pt','fr'];
 // The selected language is passed from the upload page and survives navigation.
 try{const q=new URLSearchParams(location.search).get('lang');if(supported.includes(q))return q}catch(e){}

function installReportLanguage(){
 document.querySelectorAll('[data-report-lang]').forEach(b=>{
  b.classList.toggle('active',b.dataset.reportLang===reportLang());
  b.setAttribute('aria-pressed',b.dataset.reportLang===reportLang()?'true':'false');
  b.onclick=()=>{
   const next=b.dataset.reportLang;
   if(!['en','ru','es','it','de','hi','pt','fr'].includes(next))return;
   try{localStorage.setItem('after-language',next)}catch(e){}
   try{const u=new URL(location.href);u.searchParams.set('lang',next);history.replaceState(null,'',u.toString())}catch(e){}
   document.documentElement.lang=next;
   render();
   installReportLanguage();
   translateReportText();
   requestAnimationFrame(()=>{installReportLanguage();translateReportText();translateFreeReportStatic()});
  };
 });

 it:{guideTitle:'Cosa puoi fare in questo rapporto',guideBody:'Filtra i grafici per anno o intervallo di date, alterna tra conteggio dei messaggi e delle parole e scorri all’interno dei grafici lunghi. Seleziona un punto, giorno, settimana, mese o periodo per vedere i relativi messaggi. Confronta i periodi usando le stesse misure. L’analisi AI facoltativa aggiunge un’interpretazione testuale; questo rapporto mostra schemi misurabili nell’archivio.',comparisonGuide:'Inizia dalla legenda. Ogni scheda corrisponde a un periodo; le barre sono scalate all’interno della scheda e i numeri sopra indicano i valori effettivi. Confronta questi valori tra le schede. Seleziona una scheda per vedere i messaggi del periodo.',longestActiveStreak:'Serie di attività più lunga',consecutiveActiveDays:'Giorni consecutivi con attività.',longestConsecutiveDays:'Serie più lunga di giorni attivi',messagesPerActiveDay:'Messaggi per giorno attivo',peakCommunicationHour:'Ora con più attività',busiestWeekday:'Giorno della settimana più attivo',summaryTitle:'In breve',summaryPeak:'Il volume di messaggi più alto è nel periodo {period}: {count} messaggi.',summaryCompareMore:'Nel periodo {periodA} ci sono stati più messaggi ({countA}) che nel periodo {periodB} ({countB}).',summaryCompareLess:'Nel periodo {periodA} ci sono stati meno messaggi ({countA}) che nel periodo {periodB} ({countB}).',summaryCompareEqual:'I due periodi hanno lo stesso numero di messaggi: {count}.',summarySingle:'Sono disponibili dati per un solo periodo: {period} ({count} messaggi).',summaryVolumeOnly:'Questo descrive soltanto il volume dei messaggi.',conflictMarkers:'messaggi con indicatori di conflitto',repairMarkers:'messaggi con indicatori di riparazione',futureMarkers:'messaggi con indicatori di futuro',affectionMarkers:'messaggi con indicatori di affetto'},
 de:{guideTitle:'Was Sie in diesem Bericht tun können',guideBody:'Filtern Sie Diagramme nach Jahr oder Datumsbereich, wechseln Sie zwischen Nachrichten- und Wortzahlen und bewegen Sie lange Diagramme in ihrem eigenen Fenster. Wählen Sie einen Punkt, Tag, eine Woche, einen Monat oder Zeitraum aus, um die zugehörigen Nachrichten zu öffnen. Vergleichen Sie Zeiträume anhand derselben Kennzahlen. Die optionale KI-Analyse ergänzt eine schriftliche Einordnung; dieser Bericht zeigt messbare Muster im Archiv.',comparisonGuide:'Lesen Sie zuerst die Legende. Jede Karte steht für einen Zeitraum; die Balkenhöhen werden innerhalb der Karte skaliert, die Zahlen darüber zeigen die tatsächlichen Werte. Vergleichen Sie die Zahlen zwischen den Karten. Wählen Sie eine Karte aus, um die Nachrichten dieses Zeitraums anzusehen.',longestActiveStreak:'Längste Aktivitätsserie',consecutiveActiveDays:'Aufeinanderfolgende Tage mit Aktivität.',longestConsecutiveDays:'Längste Folge aktiver Tage',messagesPerActiveDay:'Nachrichten pro aktivem Tag',peakCommunicationHour:'Aktivste Stunde',busiestWeekday:'Aktivster Wochentag',summaryTitle:'Kurz zusammengefasst',summaryPeak:'Das höchste Nachrichtenvolumen entfällt auf {period}: {count} Nachrichten.',summaryCompareMore:'Im Zeitraum {periodA} gab es mehr Nachrichten ({countA}) als im Zeitraum {periodB} ({countB}).',summaryCompareLess:'Im Zeitraum {periodA} gab es weniger Nachrichten ({countA}) als im Zeitraum {periodB} ({countB}).',summaryCompareEqual:'Beide Zeiträume hatten gleich viele Nachrichten: {count}.',summarySingle:'Nur für einen Zeitraum liegen Daten vor: {period} ({count} Nachrichten).',summaryVolumeOnly:'Dies beschreibt ausschließlich das Nachrichtenvolumen.',conflictMarkers:'Nachrichten mit Konfliktmarkern',repairMarkers:'Nachrichten mit Reparaturmarkern',futureMarkers:'Nachrichten mit Zukunftsmarkern',affectionMarkers:'Nachrichten mit Zuneigungsmarkern'}

 const root=document.getElementById('main');
 if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 const escRe=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 nodes.forEach(n=>{
   let v=n.nodeValue;
   for(const k of keys){
     if(!k) continue;
     const re=new RegExp(escRe(k),'gi');
     v=v.replace(re,()=>map[k]);
   }
   if(v!==n.nodeValue)n.nodeValue=v;
 });

 en:{button:'How to read this chart',means:'What it means:',look:'What to look for:',volume:{title:'How to read this chart',meaning:'This shows how communication volume or word volume changed over the selected time resolution. Each line represents one participant.',watch:'Look for sustained rises or falls, divergence between the two people, sudden bursts, and long periods of low activity. A volume change is not by itself evidence of stronger or weaker feelings.'},response:{title:'How to read this chart',meaning:'This tracks the average time it took each participant to reply after the other person wrote. Very long gaps are capped in the response metric.',watch:'Look for a persistent increase in one person’s waiting time, widening differences between the two lines, or a sudden change that lasts across several periods.'},length:{title:'How to read this chart',meaning:'This shows average words per message for each participant over time. It captures whether messages became more compressed or more elaborate.',watch:'Look for sustained shortening, especially if it happens together with slower replies or lower switching between speakers. Longer messages can also reflect conflict or practical discussion, so context matters.'},heat:{title:'How to read this chart',meaning:'Each cell shows how many messages occurred in a particular weekday and hour. Darker cells represent denser conversation periods.',watch:'Look for the times when contact was concentrated, whether that rhythm changed elsewhere in the archive, and whether communication became limited to short recurring windows.'},balance:{title:'How to read this chart',meaning:'Reciprocity balance summarizes how evenly message volume was distributed between the two participants. The second line shows one participant’s share for comparison.',watch:'Look for a sustained drop in balance and for periods where one participant’s share moves away from the midpoint. One busy week alone is less important than a persistent shift.'},turn:{title:'How to read this chart',meaning:'Switch rate measures how often the conversation moved from one speaker to the other. The companion line tracks average same-speaker runs.',watch:'Look for switch rate falling while same-speaker runs rise. That combination means the conversation is becoming less turn-by-turn and more clustered into longer runs.'},silence:{title:'How to read this chart',meaning:'The two lines separate ordinary waiting from unusually long gaps: median waiting shows the typical pause, while the 90th percentile shows the longer end of the distribution.',watch:'Look for the typical wait rising, the upper line rising much faster, or both. A widening gap between them means occasional long silences are becoming more pronounced even if ordinary replies remain similar.'},signal:{title:'How to read this chart',meaning:'This is an observable communication index built from archive-level markers. It is intended to show structural change over time, not to score love or private feelings.',watch:'Look for sustained movement rather than a single point. The structural-shift marker highlights the period that the deeper analysis identified as especially important.'},messageVolume:{title:'How to read this chart',meaning:'Each bar is the total number of messages in that month. The bars show communication intensity, not relationship quality.',watch:'Look for persistent increases or decreases, abrupt breaks in the pattern, and whether the change is temporary or sustained across multiple months.'}},

график',meaning:'Switch rate показывает, как часто разговор переходил от одного собеседника к другому. Вторая линия показывает среднюю длину последовательности сообщений одного человека.',watch:'Смотрите, падает ли частота переключения одновременно с ростом длин последовательностей одного человека. Это означает, что разговор становится менее диалоговым и более кластерным.'},silence:{title:'Как читать этот график',meaning:'Две линии отделяют обычные паузы от необычно длинных: медиана показывает типичное ожидание, а 90-й перцентиль — длинный хвост распределения.',watch:'Смотрите, растёт ли обычное ожидание, растёт ли верхняя линия быстрее или происходят оба изменения. Расширение разрыва означает, что редкие длинные паузы становятся заметнее.'},signal:{title:'Как читать этот график',meaning:'Это наблюдаемый индекс коммуникации, построенный на маркерах архива. Он показывает структурные изменения во времени, а не оценивает любовь или личные чувства.',watch:'Смотрите на устойчивое движение, а не на одну точку. Маркер structural shift показывает период, который глубокий анализ определил как особенно важный.'},messageVolume:{title:'Как читать этот график',meaning:'Каждый столбец показывает общее число сообщений за месяц. Столбцы отражают интенсивность общения, а не качество отношений.',watch:'Смотрите на устойчивый рост или спад, резкие переломы и на то, временное это изменение или оно сохраняется несколько месяцев.'}},
 es:{button:'Cómo leer este gráfico',means:'Qué significa:',look:'En qué fijarse:',volume:{title:'Cómo leer este gráfico',meaning:'Muestra cómo cambió el volumen de mensajes o palabras en la escala temporal seleccionada. Cada línea representa a una persona.',watch:'Busca subidas o bajadas sostenidas, divergencias entre las dos personas, picos repentinos y largos periodos de baja actividad. Un cambio de volumen por sí solo no demuestra sentimientos más fuertes o más débiles.'},response:{title:'Cómo leer este gráfico',meaning:'Muestra el tiempo medio que tardó cada persona en responder después de que escribiera la otra. Las pausas muy largas están limitadas en esta métrica.',watch:'Busca un aumento persistente del tiempo de espera de una persona, una diferencia creciente entre las líneas o un cambio repentino que dure varios periodos.'},length:{title:'Cómo leer este gráfico',meaning:'Muestra el promedio de palabras por mensaje de cada persona a lo largo del tiempo.',watch:'Busca un acortamiento sostenido, especialmente junto con respuestas más lentas o menos cambios de turno. Los mensajes largos también pueden reflejar conflictos o asuntos prácticos.'},heat:{title:'Cómo leer este mapa',meaning:'Cada celda muestra cuántos mensajes hubo en una combinación concreta de día y hora. Las celdas más intensas representan periodos de conversación más densos.',watch:'Mira cuándo se concentraba el contacto, si ese ritmo cambió y si la comunicación quedó limitada a ventanas cortas y repetidas.'},balance:{title:'Cómo leer este gráfico',meaning:'El equilibrio de reciprocidad resume cómo se distribuyó el volumen de mensajes entre las dos personas. La segunda línea muestra la cuota de una persona para comparar.',watch:'Busca una caída sostenida del equilibrio y periodos en los que la cuota de una persona se aleje del punto medio.'},turn:{title:'Cómo leer este gráfico',meaning:'La tasa de cambio mide con qué frecuencia la conversación pasa de una persona a la otra. La segunda línea muestra la longitud media de las secuencias de una misma persona.',watch:'Busca una tasa de cambio menor junto con secuencias más largas de una misma persona. Eso indica una conversación menos alternada y más agrupada.'},silence:{title:'Cómo leer este gráfico',meaning:'Las dos líneas separan la espera habitual de los silencios inusualmente largos: la mediana muestra la pausa típica y el percentil 90 muestra la parte larga de la distribución.',watch:'Busca si aumenta la espera típica, si la línea superior crece mucho más rápido o si ocurren ambas cosas.'},signal:{title:'Cómo leer este gráfico',meaning:'Es un índice observable de comunicación construido con marcadores del archivo. Muestra cambios estructurales, no mide amor ni sentimientos privados.',watch:'Busca movimientos sostenidos, no un solo punto. El marcador de cambio estructural señala el periodo destacado por el análisis profundo.'},messageVolume:{title:'Cómo leer este gráfico',meaning:'Cada barra muestra el número total de mensajes de ese mes. Las barras muestran intensidad de comunicación, no calidad de la relación.',watch:'Busca aumentos o descensos persistentes, rupturas bruscas del patrón y si el cambio se mantiene durante varios meses.'}},
 it:{button:'Come leggere questo grafico',means:'Cosa significa:',look:'Cosa osservare:',volume:{title:'Come leggere questo grafico',meaning:'Mostra come è cambiato il volume di messaggi o parole nella scala temporale selezionata. Ogni linea rappresenta una persona.',watch:'Osserva aumenti o cali persistenti, divergenze tra le due persone, picchi improvvisi e lunghi periodi di bassa attività. Il volume da solo non dimostra sentimenti più forti o più deboli.'},response:{title:'Come leggere questo grafico',meaning:'Mostra il tempo medio impiegato da ciascuna persona per rispondere dopo il messaggio dell’altra. Le pause molto lunghe sono limitate nella metrica.',watch:'Osserva un aumento persistente del tempo di attesa, una distanza crescente tra le linee o un cambiamento improvviso che dura per più periodi.'},length:{title:'Come leggere questo grafico',meaning:'Mostra la media delle parole per messaggio di ciascuna persona nel tempo.',watch:'Osserva una riduzione persistente, soprattutto insieme a risposte più lente o a meno cambi di turno. I messaggi più lunghi possono anche riflettere conflitti o questioni pratiche.'},heat:{title:'Come leggere questa mappa',meaning:'Ogni cella mostra quanti messaggi sono stati inviati in una specifica combinazione di giorno e ora. Le celle più intense indicano periodi di conversazione più densi.',watch:'Osserva quando il contatto era concentrato, se il ritmo è cambiato e se la comunicazione si è limitata a brevi finestre ricorrenti.'},balance:{title:'Come leggere questo grafico',meaning:'Il bilanciamento della reciprocità riassume quanto il volume dei messaggi fosse distribuito tra le due persone. La seconda linea mostra la quota di una persona per confronto.',watch:'Osserva un calo persistente del bilanciamento e i periodi in cui la quota di una persona si allontana dal punto centrale.'},turn:{title:'Come leggere questo grafico',meaning:'Il tasso di cambio misura quanto spesso la conversazione passa da una persona all’altra. La seconda linea mostra la lunghezza media delle sequenze dello stesso interlocutore.',watch:'Osserva un calo del tasso di cambio insieme a sequenze più lunghe dello stesso interlocutore. Indica una conversazione meno alternata e più raggruppata.'},silence:{title:'Come leggere questo grafico',meaning:'Le due linee separano l’attesa normale dai silenzi insolitamente lunghi: la mediana mostra la pausa tipica e il 90° percentile mostra la parte lunga della distribuzione.',watch:'Osserva se aumenta l’attesa tipica, se la linea superiore cresce molto più rapidamente o entrambe le cose.'},signal:{title:'Come leggere questo grafico',meaning:'È un indice osservabile della comunicazione costruito sui marcatori dell’archivio. Mostra cambiamenti strutturali, non misura amore o sentimenti privati.',watch:'Osserva movimenti persistenti, non un singolo punto. Il marker di cambiamento strutturale evidenzia il periodo considerato importante dall’analisi approfondita.'},messageVolume:{title:'Come leggere questo grafico',meaning:'Ogni barra mostra il numero totale di messaggi del mese. Le barre mostrano l’intensità della comunicazione, non la qualità della relazione.',watch:'Osserva aumenti o cali persistenti, rotture improvvise del modello e se il cambiamento dura per più mesi.'}},
 de:{button:'So liest du diesen Graphen',means:'Was es bedeutet:',look:'Worauf du achten solltest:',volume:{title:'So liest du diesen Graphen',meaning:'Zeigt, wie sich die Anzahl der Nachrichten oder Wörter über den gewählten Zeitraum verändert hat. Jede Linie steht für eine Person.',watch:'Achte auf anhaltende Anstiege oder Rückgänge, Unterschiede zwischen den beiden Personen, plötzliche Spitzen und lange Phasen geringer Aktivität. Das Volumen allein beweist keine stärkeren oder schwächeren Gefühle.'},response:{title:'So liest du diesen Graphen',meaning:'Zeigt die durchschnittliche Zeit, die jede Person nach einer Nachricht der anderen zum Antworten benötigt hat. Sehr lange Pausen werden in dieser Kennzahl begrenzt.',watch:'Achte auf dauerhaft längere Wartezeiten einer Person, wachsende Abstände zwischen den Linien oder eine plötzliche Veränderung über mehrere Zeiträume.'},length:{title:'So liest du diesen Graphen',meaning:'Zeigt die durchschnittliche Anzahl der Wörter pro Nachricht jeder Person im Zeitverlauf.',watch:'Achte auf eine anhaltende Verkürzung, besonders zusammen mit langsameren Antworten oder weniger Sprecherwechseln. Längere Nachrichten können auch Konflikte oder praktische Themen widerspiegeln.'},heat:{title:'So liest du diese Karte',meaning:'Jede Zelle zeigt, wie viele Nachrichten an einem bestimmten Wochentag und zu einer bestimmten Stunde gesendet wurden. Dunklere Zellen zeigen dichtere Gesprächsphasen.',watch:'Achte darauf, wann der Kontakt konzentriert war, ob sich dieser Rhythmus verändert hat und ob die Kommunikation auf kurze wiederkehrende Zeitfenster begrenzt wurde.'},balance:{title:'So liest du diesen Graphen',meaning:'Die Reziprozitätsbalance zeigt, wie gleichmäßig das Nachrichtenvolumen zwischen den beiden Personen verteilt war. Die zweite Linie zeigt zum Vergleich den Anteil einer Person.',watch:'Achte auf einen anhaltenden Rückgang der Balance und Zeiträume, in denen der Anteil einer Person deutlich von der Mitte abweicht.'},turn:{title:'So liest du diesen Graphen',meaning:'Die Wechselrate zeigt, wie oft das Gespräch von einer Person zur anderen wechselte. Die zweite Linie zeigt die durchschnittliche Länge von Nachrichtenfolgen derselben Person.',watch:'Achte darauf, ob die Wechselrate sinkt, während die Folgen derselben Person länger werden. Das weist auf weniger abwechselnden und stärker gebündelten Gesprächsverlauf hin.'},silence:{title:'So liest du diesen Graphen',meaning:'Die beiden Linien trennen normale Wartezeiten von ungewöhnlich langen Pausen: Der Median zeigt die typische Pause, das 90. Perzentil den langen Rand der Verteilung.',watch:'Achte darauf, ob die typische Wartezeit steigt, ob die obere Linie deutlich schneller wächst oder beides.'},signal:{title:'So liest du diesen Graphen',meaning:'Dies ist ein beobachtbarer Kommunikationsindex aus Archivmarkern. Er zeigt strukturelle Veränderungen und bewertet weder Liebe noch private Gefühle.',watch:'Achte auf anhaltende Bewegungen statt auf einen einzelnen Punkt. Der Marker für den strukturellen Wandel zeigt den vom Tiefenanalyse-Schritt hervorgehobenen Zeitraum.'},messageVolume:{title:'So liest du diesen Graphen',meaning:'Jeder Balken zeigt die Gesamtzahl der Nachrichten in diesem Monat. Die Balken zeigen Kommunikationsintensität, nicht Beziehungsqualität.',watch:'Achte auf anhaltende Anstiege oder Rückgänge, abrupte Brüche und darauf, ob die Veränderung nur vorübergehend ist oder mehrere Monate anhält.'}}
};

 hi:{button:'यह ग्राफ़ कैसे पढ़ें',means:'इसका अर्थ:',look:'क्या देखें:',volume:{title:'संदेशों का आयतन',meaning:'यह चुने गए समय स्तर पर संदेशों या शब्दों की संख्या में बदलाव दिखाता है। हर रेखा एक व्यक्ति को दर्शाती है।',watch:'लगातार बढ़ोतरी या गिरावट, दोनों लोगों की रेखाओं के बीच अंतर और कम गतिविधि की लंबी अवधि देखें। अकेले संदेशों की संख्या भावनाओं का प्रमाण नहीं है।'},response:{title:'जवाब का समय',meaning:'यह दिखाता है कि दूसरे व्यक्ति के संदेश के बाद प्रत्येक व्यक्ति ने औसतन कितनी देर में जवाब दिया। बहुत लंबे विराम इस माप में सीमित किए गए हैं।',watch:'किसी एक व्यक्ति का जवाब लगातार देर से आना, दोनों रेखाओं के बीच बढ़ता अंतर या कई अवधियों तक बना बदलाव देखें।'},length:{title:'संदेशों की लंबाई',meaning:'यह समय के साथ प्रत्येक व्यक्ति के प्रति संदेश औसत शब्द दिखाता है।',watch:'लगातार छोटे होते संदेश देखें, ख़ासकर जब जवाब धीमे हों या बोलने वाले कम बदलें। लंबे संदेश विवाद या व्यावहारिक चर्चा भी दिखा सकते हैं।'},heat:{title:'गतिविधि का समय',meaning:'हर खाने में सप्ताह के किसी दिन और घंटे के संदेशों की संख्या है। गहरा रंग अधिक गतिविधि दर्शाता है।',watch:'देखें कि बातचीत कब केंद्रित थी, उसका समय बदला या नहीं और क्या संपर्क छोटे दोहराए जाने वाले समय तक सीमित हो गया।'},balance:{title:'भागीदारी का संतुलन',meaning:'यह बताता है कि दोनों लोगों के बीच संदेशों का आयतन कितना समान था। दूसरी रेखा तुलना के लिए एक व्यक्ति का हिस्सा दिखाती है।',watch:'संतुलन में लगातार गिरावट और किसी व्यक्ति का हिस्सा मध्य बिंदु से दूर जाता हुआ देखें।'},turn:{title:'बातचीत में बारी',meaning:'बदलाव दर बताती है कि बातचीत कितनी बार एक व्यक्ति से दूसरे व्यक्ति तक गई। दूसरी रेखा एक ही व्यक्ति के लगातार संदेशों की औसत संख्या दिखाती है।',watch:'देखें कि क्या बदलाव दर गिरने के साथ एक व्यक्ति की लगातार संदेश-श्रृंखला बढ़ रही है।'},silence:{title:'जवाबों के बीच विराम',meaning:'मध्यिका सामान्य विराम दिखाती है और 90वाँ परसेंटाइल लंबे विरामों की अवधि दिखाता है।',watch:'देखें कि सामान्य प्रतीक्षा बढ़ी या कभी-कभार के लंबे विराम और लंबे हुए।'},signal:{title:'संचार संकेत',meaning:'यह आर्काइव के मापने योग्य संकेतकों पर आधारित सूचकांक है। यह समय के साथ बातचीत की संरचना दिखाता है, प्रेम या निजी भावनाओं को नहीं।',watch:'एक बिंदु के बजाय लगातार बदलाव देखें। संरचनात्मक बदलाव का चिह्न गहन विश्लेषण द्वारा चुनी गई अवधि दिखाता है।'},messageVolume:{title:'महीने के संदेश',meaning:'हर बार उस महीने के कुल संदेश दिखाता है। यह संचार की गतिविधि है, रिश्ते की गुणवत्ता नहीं।',watch:'लगातार वृद्धि या कमी और अचानक आए बदलाव देखें; जाँचें कि बदलाव अस्थायी है या कई महीने तक रहता है।'}},
 pt:{button:'Como ler este gráfico',means:'O que significa:',look:'O que observar:',volume:{title:'Volume de mensagens',meaning:'Mostra como o volume de mensagens ou palavras mudou na escala de tempo selecionada. Cada linha representa uma pessoa.',watch:'Observe aumentos ou quedas persistentes, diferenças entre as duas pessoas, picos e longos períodos de pouca atividade. O volume, por si só, não comprova sentimentos.'},response:{title:'Tempo de resposta',meaning:'Mostra quanto tempo cada pessoa levou, em média, para responder depois que a outra escreveu. Pausas muito longas são limitadas nesta métrica.',watch:'Observe se o tempo de espera de alguém aumenta de forma persistente, se a distância entre as linhas cresce ou se a mudança dura vários períodos.'},length:{title:'Tamanho das mensagens',meaning:'Mostra a média de palavras por mensagem de cada pessoa ao longo do tempo.',watch:'Observe reduções persistentes, especialmente junto com respostas mais lentas ou menos alternância. Mensagens longas também podem refletir conflitos ou assuntos práticos.'},heat:{title:'Ritmo semanal',meaning:'Cada célula mostra quantas mensagens foram enviadas em determinado dia da semana e horário. Cores mais fortes indicam mais atividade.',watch:'Observe quando o contato se concentrava, se esse ritmo mudou e se a conversa ficou restrita a janelas curtas e recorrentes.'},balance:{title:'Equilíbrio da participação',meaning:'Resume como o volume de mensagens foi dividido entre as duas pessoas. A segunda linha mostra a participação de uma pessoa para comparação.',watch:'Observe quedas persistentes no equilíbrio e períodos em que a participação de alguém se afasta do ponto médio.'},turn:{title:'Alternância na conversa',meaning:'A taxa de alternância mede com que frequência a conversa passa de uma pessoa para outra. A outra linha mostra a média de mensagens seguidas pela mesma pessoa.',watch:'Observe se a alternância diminui enquanto aumentam as sequências da mesma pessoa. Isso indica conversas menos alternadas e mais agrupadas.'},silence:{title:'Pausas entre respostas',meaning:'A mediana mostra a pausa típica; o percentil 90 mostra a parte mais longa da distribuição.',watch:'Observe se a espera típica aumentou, se as pausas longas ficaram ainda maiores ou se os dois padrões mudaram.'},signal:{title:'Indicador de comunicação',meaning:'Índice observável construído com marcadores do arquivo. Mostra mudanças estruturais, não mede amor nem sentimentos privados.',watch:'Observe tendências persistentes, não apenas um ponto. O marcador indica o período destacado pela análise aprofundada.'},messageVolume:{title:'Mensagens por mês',meaning:'Cada barra mostra o total de mensagens daquele mês. As barras indicam intensidade de comunicação, não qualidade do relacionamento.',watch:'Observe aumentos e quedas persistentes, mudanças bruscas e se elas duram vários meses.'}},
 fr:{button:'Comment lire ce graphique',means:'Ce que cela signifie :',look:'À observer :',volume:{title:'Volume des messages',meaning:'Montre l’évolution du volume de messages ou de mots selon l’échelle de temps choisie. Chaque ligne représente une personne.',watch:'Observez les hausses ou baisses durables, les écarts entre les deux personnes, les pics et les longues périodes de faible activité. Le volume ne prouve pas à lui seul l’intensité des sentiments.'},response:{title:'Délai de réponse',meaning:'Indique le temps moyen mis par chaque personne pour répondre après un message de l’autre. Les pauses très longues sont plafonnées dans cette mesure.',watch:'Observez une hausse durable du délai d’une personne, un écart grandissant entre les lignes ou un changement qui persiste plusieurs périodes.'},length:{title:'Longueur des messages',meaning:'Montre le nombre moyen de mots par message de chaque personne au fil du temps.',watch:'Observez les raccourcissements durables, surtout avec des réponses plus lentes ou moins d’alternance. Les messages longs peuvent aussi refléter un conflit ou des sujets pratiques.'},heat:{title:'Rythme des échanges',meaning:'Chaque cellule indique le nombre de messages envoyés un jour de la semaine à une heure donnée. Une couleur plus foncée signale davantage d’activité.',watch:'Observez les moments où les échanges se concentraient, l’évolution de ce rythme et une éventuelle réduction à de courtes plages récurrentes.'},balance:{title:'Équilibre de participation',meaning:'Résume la répartition du volume de messages entre les deux personnes. La seconde ligne montre la part d’une personne à titre de comparaison.',watch:'Observez une baisse durable de l’équilibre et les périodes où la part d’une personne s’éloigne du milieu.'},turn:{title:'Alternance des échanges',meaning:'Le taux d’alternance mesure la fréquence à laquelle la conversation passe d’une personne à l’autre. L’autre ligne indique la longueur moyenne des séries de messages d’une même personne.',watch:'Observez si l’alternance diminue tandis que les séries d’une personne s’allongent.'},silence:{title:'Pauses entre les réponses',meaning:'La médiane indique la pause habituelle et le 90e percentile représente la partie longue de la distribution.',watch:'Observez si le délai habituel augmente, si les pauses occasionnelles deviennent plus longues, ou les deux.'},signal:{title:'Indicateur de communication',meaning:'Indice observable construit à partir des marqueurs de l’archive. Il montre les changements structurels, sans évaluer l’amour ni les sentiments privés.',watch:'Observez les tendances durables plutôt qu’un point isolé. Le repère indique la période mise en avant par l’analyse approfondie.'},messageVolume:{title:'Messages par mois',meaning:'Chaque barre indique le nombre total de messages du mois. Elle mesure l’intensité des échanges, pas la qualité de la relation.',watch:'Observez les hausses et baisses durables, les ruptures soudaines et leur persistance sur plusieurs mois.'}}
});
function chartHelp(key){
 const lang=reportLang(); const base=CHART_HELP[lang]||CHART_HELP.en; const x=base[key]||CHART_HELP.en[key]||CHART_HELP.en.volume;

   }[lang]||null;
   if(valid.length<6)return `<div class="trend-conclusion"><b>${words?.takeaway||'Chart takeaway'}</b>${words?.insufficient||'Not enough periods to make a reliable structural-shift assessment.'}<span class="trend-caveat">${words?.caveat||'Descriptive evidence only; this does not establish cause or feelings.'}</span></div>`;
   const rawOf=r=>String(r.raw||r.month||r.week||r.date||r.period||r.year||'');
   const fmtDate=r=>{const raw=rawOf(r); if(/^\d{4}-\d{2}/.test(raw))return `${monthShort(raw)} ${raw.slice(0,4)}`; return raw;};
   let best=null;
   for(const ser of series){const vals=valid.map(r=>Number(typeof ser.value==='function'?ser.value(r):r[ser.key])).map(v=>Number.isFinite(v)?Math.max(0,v):0);
     if(vals.length<6)continue; const overall=vals.reduce((a,b)=>a+b,0)/vals.length; if(overall===0)continue;

   }
   if(!best||best.rel<.22)return `<div class="trend-conclusion"><b>${words?.takeaway||'Chart takeaway'}</b>${words?.none||'No clear large structural shift was detected in this metric.'}<span class="trend-caveat">${words?.heuristic||'Heuristic comparison of segment averages, not a causal test.'}</span></div>`;
   const before=fmtDate(valid[best.split-1]), after=fmtDate(valid[best.split]); const pct=Math.round(best.rel*100); const up=best.delta>0;
   let meaning='';
   if(kind==='response')meaning=up?(words?.upReply||'Reply delays increased noticeably.'):(words?.downReply||'Reply delays decreased noticeably.');
   else if(kind==='length')meaning=up?(words?.upLength||'Messages became noticeably longer.'):(words?.downLength||'Messages became noticeably shorter.');

   else if(kind==='turn')meaning=words?.turn||'Turn-taking structure shifted.';

   return `<div class="trend-conclusion"><b>${words?.possible||'Possible structural shift'}</b>${esc(meaning)} ${words?.boundary||'Largest detected boundary:'} <strong>${esc(before)} → ${esc(after)}</strong>. ${words?.change||'Segment average changed by about'} <strong>${pct}%</strong> (${esc(best.ser.label||best.ser.key||'metric')}).<span class="trend-caveat">${words?.cause||'Automatic heuristic, not a formal causal test.'}</span></div>`;

function installLanguageObserver(){

 _afterReportLangObserver=new MutationObserver(mutations=>{
   if(reportLang()==='en'||_afterReportLangUpdateQueued)return;
   const relevant=mutations.some(m=>{
     const el=m.target.nodeType===Node.ELEMENT_NODE?m.target:m.target.parentElement;

     _afterReportLangUpdateQueued=false;

     // translating so one UI update cannot recursively schedule itself.

     _afterReportLangObserver.observe(root,{subtree:true,childList:true,characterData:true});

 });
